name: uptime
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping API
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://maratu-api.raphaelnascimento.workers.dev/api/state)
          echo "api /api/state -> $code"
          if [ "$code" != "401" ]; then
            echo "::error::API unhealthy: got $code, expected 401"
            exit 1
          fi
      - name: ping site
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://maratu.com.br/)
          echo "site / -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::Site unhealthy: got $code, expected 200"
            exit 1
          fi
