<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — MARATU Estúdio</title>
  <link rel="icon" type="image/png" href="/favicon-v5.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon-v5.png">
  <style>
    @font-face { font-family: 'Jack';    src: url('/TRYJackAlpha-Regular.woff2') format('woff2'), url('/TRYJackAlpha-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Clother'; src: url('/TRYClother-Regular.woff2') format('woff2'), url('/TRYClother-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Clother'; src: url('/TRYClother-Bold.woff2') format('woff2'), url('/TRYClother-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Clother'; src: url('/TRYClother-Black.woff2') format('woff2'), url('/TRYClother-Black.ttf') format('truetype'); font-weight: 900; font-display: swap; }

    :root {
      --laranja: #C8501A;
      --azul: #0E3272;
      --areia: #F0ECE4;
      --preto: #0D0D0B;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: 'Clother', sans-serif; background: var(--areia); color: var(--preto); overflow: hidden; }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: url('/mangue.webp') center center / cover no-repeat;
      opacity: 0.14;
    }

    .container {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }

    .logo { margin-bottom: 48px; }
    .logo img { height: 48px; width: 48px; border-radius: 50%; }

    .tag {
      font-family: 'Clother', sans-serif; font-size: 0.55rem;
      color: var(--laranja); letter-spacing: 0.25em; text-transform: uppercase;
      margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
      justify-content: center;
    }
    .tag::before, .tag::after { content: ''; display: block; width: 20px; height: 1px; background: var(--laranja); }

    .numero {
      font-family: 'Jack', sans-serif;
      font-size: clamp(6rem, 20vw, 16rem);
      color: var(--laranja); line-height: 0.85;
      opacity: 0.12;
      position: absolute;
      left: 50%; transform: translateX(-50%);
      white-space: nowrap; pointer-events: none;
      top: 50%; margin-top: -0.6em;
    }

    .titulo {
      font-family: 'Clother', sans-serif; font-weight: 900;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      color: var(--preto); line-height: 1.1; margin-bottom: 12px;
      position: relative; z-index: 3;
    }

    .sub {
      font-size: 1rem; color: rgba(13,13,11,0.55);
      line-height: 1.7; margin-bottom: 48px; max-width: 400px;
      position: relative; z-index: 3;
    }

    .acoes {
      display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
      position: relative; z-index: 3;
    }

    .btn-home {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 15px 28px;
      background: var(--laranja);
      border: 1.5px solid var(--preto);
      border-radius: 999px;
      box-shadow: 4px 4px 0 var(--preto);
      font-family: 'Clother', sans-serif; font-weight: 900;
      font-size: 0.9rem; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--areia); text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn-home:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--preto); }
    .btn-home:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--preto); }

    .btn-loja {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 15px 28px;
      background: transparent;
      border: 1.5px solid var(--preto);
      border-radius: 999px;
      box-shadow: 4px 4px 0 var(--preto);
      font-family: 'Clother', sans-serif; font-weight: 900;
      font-size: 0.9rem; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--preto); text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }
    .btn-loja:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--preto); background: rgba(13,13,11,0.06); }
    .btn-loja:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--preto); }

    .rodape {
      position: absolute; bottom: 28px;
      font-family: 'Clother', sans-serif; font-size: 0.48rem;
      color: rgba(13,13,11,0.3); letter-spacing: 0.1em; text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .acoes { flex-direction: column; width: 100%; max-width: 280px; }
      .btn-home, .btn-loja { justify-content: center; }
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HCJ291HL72"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HCJ291HL72');
  </script>
</head>
<body>
  <div class="bg"></div>
  <span class="numero">404</span>
  <div class="container">
    <div class="logo">
      <a href="/"><img src="/logo-redondo.png" alt="MARATU Estúdio"></a>
    </div>
    <p class="tag">Erro 404</p>
    <h1 class="titulo">Ops, Maratuzinho.<br>Acho que você se perdeu, hein?</h1>
    <p class="sub">Essa página não existe — mas a loja está aberta e o mangue continua lindo.</p>
    <div class="acoes">
      <a href="/" class="btn-home">← Voltar ao início</a>
      <a href="/loja.html" class="btn-loja">Ver a loja ↗</a>
    </div>
    <p class="rodape">MARATU Estúdio · Aracaju, SE · EST. 2026</p>
  </div>
  <script src="js/tracking.js"></script>
</body>
</html>
