  <style>
    @font-face { font-family: 'Clother'; src: url('/TRYClother-Regular.woff2') format('woff2'), url('/TRYClother-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Clother'; src: url('/TRYClother-Bold.woff2') format('woff2'), url('/TRYClother-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Clother'; src: url('/TRYClother-Black.woff2') format('woff2'), url('/TRYClother-Black.ttf') format('truetype'); font-weight: 900; font-display: swap; }

    /* O código é pra ser copiado à mão do adesivo pra tela. Mono de sistema, sem baixar
       fonte nova: no site --mono é alias de Clother (Space Mono foi descontinuada, ver
       design.md), e Clother não alinha dígito com letra. */
    :root{
      --clother:'Clother',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
      --mono-cod:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      /* Laranja do site. O cartão, porém, tem palete própria: é papel impresso, não tela.
         Areia Orla e a tinta #1C1A18 vêm do certificado que o Rapha aprovou — mais quentes
         e mais claras que --areia (#F0ECE4) e --preto (#0D0D0B) de propósito, pra dar cara
         de papel. Não são os tokens do site com erro de digitação. */
      --laranja:#C8501A;
      --areia:#F0ECE4;
      --areia-orla:#F0EBE2;
      --tinta-papel:#1C1A18;
      --tinta-fraca:#6E6152;
      --verde:#1D6E4F;
    }
    *{box-sizing:border-box}
    /* Laranja no html também: sem isso o celular mostra faixa branca no rubber-band do
       scroll e nas bordas quando a página é mais curta que a tela. */
    html{background:var(--laranja);overscroll-behavior:none}
    body{margin:0;background:var(--laranja);font-family:var(--clother);-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

    /* ══ CARTÃO DO CERTIFICADO ══ o Worker injeta a marcação no lugar do marcador de corpo,
       lá embaixo. Vive aqui pro design ficar no repo, como no diário.
       Cuidado: não escrever o marcador por extenso em comentário, senão a troca pega ele. */
    .mrt-page{background:var(--laranja);flex:1 0 auto;display:flex;
      flex-direction:column;align-items:center;justify-content:center;gap:18px;
      padding:44px 24px;perspective:900px}
    .mrt-card{width:344px;max-width:100%;background:var(--areia-orla);border-radius:14px;
      padding:22px 26px 0;position:relative;overflow:hidden;isolation:isolate;
      background-image:radial-gradient(rgba(28,26,24,.055) .6px,transparent .7px),radial-gradient(rgba(28,26,24,.04) .6px,transparent .7px);
      background-size:4px 4px,7px 7px;
      /* a sombra some daqui: o script a redesenha a cada quadro, seguindo a inclinação */
      box-shadow:0 26px 54px rgba(50,14,0,.42),0 2px 0 rgba(255,255,255,.55) inset;
      transition:transform .14s ease-out,box-shadow .14s ease-out}
    /* ══ REFLEXO ══ luz varrendo o papel, como metal fosco: faixa larga e macia, não
       espelho.
       A camada tem o TAMANHO do cartão e herda o raio, e quem anda é o gradiente dentro
       dela. A primeira versão era maior que o cartão e deslizava por transform — mais
       barato, mas `will-change:transform` promove a camada e aí o navegador aplica só o
       recorte retangular: a faixa escapava pelos cantos arredondados.
       z-index -1: a luz é na superfície do papel, o texto é impresso nela. Por cima ela
       lavava os rótulos, que já são de baixo contraste. */
    .mrt-card::after{content:"";position:absolute;inset:0;border-radius:inherit;
      pointer-events:none;z-index:-1;
      background:linear-gradient(112deg,
        transparent 34%, rgba(255,252,246,.32) 44%, rgba(255,255,255,.62) 50%,
        rgba(255,252,246,.30) 56%, transparent 66%);
      background-size:300% 300%;
      background-position:calc(50% + var(--luz-x,0px)) calc(50% + var(--luz-y,0px));
      mix-blend-mode:soft-light}
    .mrt-seal{width:96px;height:96px;position:absolute;top:20px;right:24px;display:block;
      transform:rotate(-6deg);filter:drop-shadow(0 3px 5px rgba(28,26,24,.3));
      cursor:zoom-in;-webkit-tap-highlight-color:transparent}
    /* Anel de foco no cartão sim, dentro da lupa não: lá o selo está girado e enorme, e o
       anel virava um quadrado torto e cortado na tela. Na lupa quem recebe o foco é o
       próprio fundo escuro, que não gira. */
    .mrt-seal:focus-visible{outline:2px solid #FFFCF6;outline-offset:4px}

    /* ══ SELO EM TELA CHEIA ══ toque no selo: ele dá uma volta em torno do próprio eixo,
       mostrando frente, verso e frente de novo, enquanto cresce. O certificado fica no
       escuro atrás. Sair é tocar em qualquer lugar, ou Esc. */
    .selo-lupa{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
      background:rgba(12,10,9,.86);opacity:0;transition:opacity .3s ease;cursor:zoom-out;
      perspective:1500px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
    .selo-lupa:focus{outline:none}
    .selo-lupa.on{opacity:1}
    /* rotateY, não rotate: o selo vira como uma moeda, não roda de cabeça pra baixo */
    .selo-lupa .mrt-seal{position:static;top:auto;right:auto;cursor:zoom-out;
      width:min(76vw,380px);height:min(76vw,380px);
      transform:rotateY(0deg) scale(.24);
      transition:transform .8s cubic-bezier(.22,.72,.24,1)}
    .selo-lupa.on .mrt-seal{transform:rotateY(360deg) scale(1)}
    /* Dentro da lupa o selo sai do caminho do Tab (o JS troca o tabindex): quem manda é o
       próprio diálogo, que fecha no Esc. Assim não sobra elemento focável sem anel visível. */
    .selo-lupa .mrt-seal:focus,.selo-lupa .mrt-seal:focus-visible{outline:none}
    /* Quem pediu menos movimento não leva a volta de 360°: só o crescer. */
    @media (prefers-reduced-motion:reduce){
      .selo-lupa .mrt-seal{transform:scale(.6);transition:transform .3s ease}
      .selo-lupa.on .mrt-seal{transform:scale(1)}
    }
    .selo-lupa-dica{position:absolute;left:0;right:0;bottom:max(30px,env(safe-area-inset-bottom));
      text-align:center;font-size:12.5px;letter-spacing:.06em;color:rgba(255,252,246,.62);
      opacity:0;transition:opacity .3s ease .5s}
    .selo-lupa.on .selo-lupa-dica{opacity:1}
    body.selo-lupa-aberta{overflow:hidden}
    .mrt-logo{width:150px;height:29px;display:block;margin-top:16px}
    .mrt-titulo{margin-top:22px}
    .mrt-nome{margin:0;font-size:24px;font-weight:500;color:var(--tinta-papel);line-height:1.15}
    .mrt-sub{margin:6px 0 0;font-size:13px;color:var(--tinta-fraca)}
    .mrt-rule{height:1px;background:rgba(28,26,24,.14);margin:16px 0 14px}
    .mrt-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}
    .mrt-full{grid-column:1/-1}
    .mrt-label{margin:0;font-size:10px;letter-spacing:.13em;color:#8A7B66;text-transform:uppercase}
    .mrt-valor{margin:3px 0 0;font-size:13.5px;color:var(--tinta-papel);line-height:1.45}
    .mrt-codigo{margin:3px 0 0;font-size:14.5px;font-family:var(--mono-cod);color:var(--tinta-papel);letter-spacing:.04em}
    .mrt-rodape{margin:18px -26px 0;padding:14px 26px;background:rgba(29,110,79,.09);
      border-top:1px solid rgba(29,110,79,.22);border-radius:0 0 14px 14px;
      display:flex;align-items:center;gap:11px;flex-wrap:wrap}
    .mrt-check{width:26px;height:26px;flex:none}
    .mrt-verif-txt{flex:1 1 auto;min-width:0}
    .mrt-verif{margin:0;font-size:15px;font-weight:500;color:#14523B;line-height:1.25}
    .mrt-verif-sub{margin:2px 0 0;font-size:11.5px;color:#3E6E5B}
    .mrt-dono{margin:4px 0 0;font-size:12.5px;color:#14523B}
    /* ══ REGISTRO EM POPUP ══ o formulário sai do fluxo e abre por cima na primeira visita.
       O Worker continua entregando o formulário no corpo da página: quem estiver sem JS vê
       ele ali mesmo, como antes. É o script que o move pra cá e cria o convite. */
    .mrt-reg-back{position:fixed;inset:0;z-index:70;display:flex;align-items:center;
      justify-content:center;padding:20px;background:rgba(12,10,9,.72);opacity:0;
      transition:opacity .26s ease;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
      overflow-y:auto}
    .mrt-reg-back.on{opacity:1}
    /* O atributo hidden vira display:none pela folha do navegador — e a regra acima, com
       display:flex, ganha dela. Sem esta linha o diálogo fica invisível mas cobrindo a tela
       inteira, comendo todo clique e todo mousemove da página: o cartão parava de se mexer,
       o selo não abria e os botões não respondiam. */
    .mrt-reg-back[hidden]{display:none}
    .mrt-reg-back .mrt-form{margin:auto;transform:translateY(14px) scale(.98);
      transition:transform .3s cubic-bezier(.2,.8,.25,1);position:relative}
    .mrt-reg-back.on .mrt-form{transform:none}
    .mrt-reg-x{position:absolute;top:10px;right:12px;width:34px;height:34px;border:0;
      border-radius:999px;background:transparent;color:var(--tinta-fraca);font-size:22px;
      line-height:1;cursor:pointer}
    .mrt-reg-x:hover{background:rgba(28,26,24,.07);color:var(--tinta-papel)}
    .mrt-reg-x:focus-visible{outline:2px solid var(--tinta-papel);outline-offset:2px}
    /* o convite que fica na página depois que o popup é fechado */
    .mrt-convite{width:344px;max-width:100%;background:var(--areia-orla);border-radius:14px;
      padding:18px 24px 20px;text-align:left;
      background-image:radial-gradient(rgba(28,26,24,.055) .6px,transparent .7px),radial-gradient(rgba(28,26,24,.04) .6px,transparent .7px);
      background-size:4px 4px,7px 7px;
      box-shadow:0 2px 0 rgba(255,255,255,.55) inset}
    .mrt-convite p{margin:0 0 13px;font-size:14.5px;line-height:1.5;color:var(--tinta-papel)}
    @media (prefers-reduced-motion:reduce){
      .mrt-reg-back,.mrt-reg-back .mrt-form{transition:none}
      .mrt-reg-back .mrt-form{transform:none}
    }

    /* ══ AÇÕES ══ segundo bloco de papel, não pílulas soltas no laranja. Mesma largura,
       mesmo canto de 14px, mesmo papel pontilhado e a mesma sombra difusa do cartão: as
       duas peças passam a ser o mesmo material, em vez de dois mundos empilhados (o
       documento macio e a pílula de borda dura). O convite é o texto; o botão é botão. */
    .mrt-acoes{width:344px;max-width:100%;background:var(--areia-orla);border-radius:14px;
      padding:20px 24px 20px;
      background-image:radial-gradient(rgba(28,26,24,.055) .6px,transparent .7px),radial-gradient(rgba(28,26,24,.04) .6px,transparent .7px);
      background-size:4px 4px,7px 7px;
      box-shadow:0 2px 0 rgba(255,255,255,.55) inset}
    .mrt-acoes-txt{margin:0 0 15px;font-size:14.5px;line-height:1.5;color:var(--tinta-papel)}
    /* mesmo botão do "Enviar confirmação", pra dentro da página não ter dois tipos de botão */
    .mrt-opiniao{display:flex;align-items:center;justify-content:center;width:100%;
      padding:13px 18px;border-radius:10px;background:#0D0D0B;color:#FFFCF6;
      font-size:14.5px;font-weight:700;line-height:1.2;text-decoration:none}
    .mrt-opiniao:active{transform:translateY(1px)}
    .mrt-site{display:block;margin:13px 0 0;text-align:center;font-size:13px;font-weight:700;
      color:var(--tinta-papel);text-decoration:underline;text-underline-offset:3px}
    .mrt-site:hover{color:var(--laranja)}
    .mrt-opiniao:focus-visible,.mrt-site:focus-visible{outline:2px solid var(--tinta-papel);outline-offset:3px}

    /* ══ AVISOS ══ selo sem peça, selo bloqueado, código que não existe. Cara da marca,
       não cara de erro. */
    .mrt-card--aviso{padding:24px 26px 26px;text-align:left}
    .mrt-aviso-tit{margin:20px 0 0;font-size:20px;font-weight:700;color:var(--tinta-papel);line-height:1.2}
    .mrt-aviso-txt{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--tinta-fraca)}
    .mrt-aviso-link{margin:16px 0 0;font-size:14px}
    .mrt-aviso-link a{color:var(--laranja);font-weight:700;text-decoration:none}
    .mrt-aviso-link a:hover{text-decoration:underline}

    /* ══ CÓDIGO DIGITADO À MÃO ══ pra quando o QR não lê */
    .mrt-busca{margin:18px 0 0;display:flex;gap:8px;flex-wrap:wrap}
    .mrt-busca input{flex:1 1 160px;min-width:0;padding:11px 13px;border:1.5px solid rgba(28,26,24,.25);
      border-radius:10px;background:#FFFCF6;font-family:var(--mono-cod);font-size:15px;
      letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-papel)}
    .mrt-busca input:focus{outline:2px solid var(--laranja);outline-offset:1px}
    .sr-so{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    /* ══ REIVINDICAÇÃO ══ só aparece no estado vendido */
    /* Sem sombra projetada: só o cartão flutua. Os blocos de baixo são papel apoiado na
       mesa, e a sombra neles competia com o documento. Fica só o fio de luz no topo. */
    .mrt-form,.mrt-recado{width:344px;max-width:100%;background:#FFFCF6;border-radius:14px;
      padding:22px 24px;box-shadow:0 2px 0 rgba(255,255,255,.55) inset}
    .mrt-form-tit,.mrt-recado-tit{margin:0;font-size:17px;font-weight:700;color:var(--tinta-papel)}
    .mrt-form-sub,.mrt-recado-txt{margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--tinta-fraca)}
    .mrt-campo{display:block;margin:16px 0 0}
    .mrt-campo span{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#8A7B66}
    .mrt-campo input{width:100%;margin-top:5px;padding:11px 13px;border:1.5px solid rgba(28,26,24,.25);
      border-radius:10px;background:var(--areia-orla);font-family:var(--clother);font-size:16px;color:var(--tinta-papel)}
    .mrt-campo input:focus{outline:2px solid var(--laranja);outline-offset:1px}
    /* separada e desmarcada: cadastro de garantia e lista de conteúdo são finalidades
       diferentes sob a LGPD, e uma não autoriza a outra */
    .mrt-news{display:flex;gap:9px;align-items:flex-start;margin:18px 0 0;padding:13px 14px;
      background:var(--areia-orla);border-radius:10px;font-size:12.5px;line-height:1.5;color:var(--tinta-fraca)}
    .mrt-news input{margin:1px 0 0;accent-color:var(--laranja);flex:none}
    .mrt-btn{margin:18px 0 0;width:100%;padding:13px 18px;border:0;border-radius:10px;
      background:var(--tinta-papel);color:#FFFCF6;font-family:var(--clother);font-size:15px;font-weight:700;cursor:pointer}
    .mrt-btn:active{transform:translateY(1px)}
    .mrt-erro{margin:12px 0 0;padding:10px 12px;border-radius:9px;background:rgba(200,80,26,.12);
      color:#8A3410;font-size:13px;line-height:1.5}
    .mrt-recado{border-left:4px solid var(--verde)}


    /* ══ RODAPÉ DO SITE ══ o mesmo da home, inclusive o Aratu que anda e foge do dedo.
       Aqui ele é laranja com tinta preta: o fundo da página é laranja e o rodapé não
       corta a página com uma faixa de outra cor. Aratu preto pelo mesmo motivo. */
    .footer{background:var(--laranja);color:#0D0D0B;
      padding:clamp(24px,3vh,36px) clamp(20px,5vw,64px) 32px;position:relative;flex:0 0 auto}
    .footer__baseline{border-top:1px solid rgba(13,13,11,0.22);
      padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
      font-family:var(--clother);font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;
      color:#0D0D0B}
    .footer__baseline p{margin:0}
    .footer__servicos a{color:inherit;text-decoration:none;transition:color .2s ease}
    .footer__servicos a:hover{color:#FFFCF6}
    .aratu-mascote{position:absolute;left:0;bottom:4px;width:48px;height:24px;pointer-events:none;z-index:10;overflow:visible}
    .aratu-mascote svg{width:100%;height:100%;overflow:visible;display:block}
    @media (max-width:640px){
      .footer__baseline{flex-direction:column}
      .aratu-mascote{width:40px;height:20px;bottom:4px}
    }

    @media (max-width:380px){
      .mrt-page{padding:28px 14px}
      .mrt-card{padding:18px 18px 0}
      .mrt-rodape{margin:16px -18px 0;padding:13px 18px}
      .mrt-seal{width:78px;height:78px;top:16px;right:16px}
      .mrt-nome{font-size:21px}
      .mrt-grid{gap:12px 12px}
    }
    @media (prefers-reduced-motion:reduce){.mrt-card{transition:none}}
  </style>
</head>

<script>
/* GA4 do certificado. Eventos próprios, como o clique_servico é próprio: um selo consultado
   não é uma encomenda, e jogar isso no clique_encomendar sujaria o funil da loja. Por isso
   o /js/tracking.js não entra aqui. O estado vem no data-estado que o Worker injeta. */
(function(){
  if(typeof gtag!=='function')return;
  var alvo=document.querySelector('[data-estado]');
  var estado=alvo?alvo.getAttribute('data-estado'):'desconhecido';
  gtag('event','selo_visto',{estado:estado});

  var form=document.querySelector('.mrt-form');
  if(form)form.addEventListener('submit',function(){
    var news=form.querySelector('[name="newsletter"]');
    gtag('event','selo_reivindicacao',{estado:estado,newsletter:!!(news&&news.checked)});
  });

  document.addEventListener('click',function(ev){
    if(!ev.target||!ev.target.closest)return;
    if(ev.target.closest('a[href*="wa.me"]'))gtag('event','selo_ajuda',{estado:estado});
    if(ev.target.closest('.mrt-opiniao'))gtag('event','selo_opiniao',{estado:estado});
    if(ev.target.closest('.mrt-site'))gtag('event','selo_site',{estado:estado});
    /* O link de serviços do rodapé dispara o MESMO clique_servico do resto do site, mas
       daqui, sem carregar o /js/tracking.js — que arrastaria junto o clique_encomendar
       e sujaria o funil da loja com os WhatsApp de suporte desta página. */
    var sv=ev.target.closest('[data-servico]');
    if(sv)gtag('event','clique_servico',{
      servico:sv.getAttribute('data-servico')||'geral',
      origem:sv.getAttribute('data-origem')||'rodape_selo'
    });
  },true);
})();
</script>

<script>
/* Pilha dos diálogos da página. São dois (a lupa do selo e o registro de posse) e eles
   dividem o mesmo estado global: scroll travado no body e o certificado fora do caminho do
   teclado. Sem uma pilha, fechar um limpava o estado do outro, e um Esc fechava os dois. */
window.__mrtModais = window.__mrtModais || (function(){
  var pilha = [], palco = null;
  function fundo(){
    if(!palco) palco = document.querySelector('.mrt-page');
    if(pilha.length){
      document.body.classList.add('selo-lupa-aberta');
      if(palco){ palco.setAttribute('aria-hidden','true'); try{palco.inert=true;}catch(e){} }
    } else {
      document.body.classList.remove('selo-lupa-aberta');
      if(palco){ palco.removeAttribute('aria-hidden'); try{palco.inert=false;}catch(e){} }
    }
  }
  return {
    entra:function(n){ if(pilha.indexOf(n)<0)pilha.push(n); fundo(); },
    sai:function(n){ var i=pilha.indexOf(n); if(i>=0)pilha.splice(i,1); fundo(); },
    topo:function(){ return pilha[pilha.length-1]||null; },
    tem:function(n){ return pilha.indexOf(n)>=0; }
  };
})();
</script>

<script>
/* O registro de posse abre sozinho na primeira vez que a pessoa cai na página. Depois de
   fechado uma vez, não incomoda mais naquele aparelho — fica o convite no corpo pra reabrir.
   Sem JS o formulário continua no fluxo da página, do jeito que o Worker mandou. */
(function(){
  var form=document.querySelector('.mrt-form');
  if(!form)return;
  var codigo=(location.pathname.split('/').filter(Boolean).pop()||'').toUpperCase();
  var chave='mrt.reg.'+codigo;
  var jaFechou=false;
  try{ jaFechou=localStorage.getItem(chave)==='1'; }catch(e){}

  var back=document.createElement('div');
  back.className='mrt-reg-back';
  back.setAttribute('role','dialog');
  back.setAttribute('aria-modal','true');
  back.setAttribute('aria-label','Registrar a posse da peça');
  back.hidden=true;

  var fechar=document.createElement('button');
  fechar.type='button';
  fechar.className='mrt-reg-x';
  fechar.setAttribute('aria-label','Fechar');
  fechar.innerHTML='&times;';

  /* o convite ocupa o lugar do formulário no corpo */
  var convite=document.createElement('div');
  convite.className='mrt-convite';
  convite.innerHTML='<p>Esse Maratu é seu? Registre ele em seu nome!</p>'+
    '<a class="mrt-opiniao" href="#" role="button">Registrar a posse</a>';
  form.parentNode.insertBefore(convite,form);
  back.appendChild(form);
  form.appendChild(fechar);
  document.body.appendChild(back);

  var focoAntes=null;
  function abre(origem){
    // se o selo estiver aberto em tela cheia, o popup espera a vez
    if(!back.hidden||window.__mrtModais.tem('lupa'))return;
    focoAntes=document.activeElement;
    back.hidden=false;
    window.__mrtModais.entra('registro');
    void back.offsetWidth;
    back.classList.add('on');
    var alvo=form.querySelector('input[name="nome"]');
    if(alvo)try{alvo.focus({preventScroll:true});}catch(e){}
    if(typeof gtag==='function')gtag('event','selo_registro_abriu',{origem:origem||'auto'});
  }
  function some(){
    if(back.hidden)return;
    back.classList.remove('on');
    window.__mrtModais.sai('registro');
    try{localStorage.setItem(chave,'1');}catch(e){}
    setTimeout(function(){ back.hidden=true; },300);
    if(focoAntes&&focoAntes.focus)try{focoAntes.focus({preventScroll:true});}catch(e){}
    if(typeof gtag==='function')gtag('event','selo_registro_fechou',{});
  }
  fechar.addEventListener('click',some);
  back.addEventListener('click',function(e){ if(e.target===back)some(); });
  // Esc só fecha quem está por cima
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&window.__mrtModais.topo()==='registro')some();
  });
  convite.querySelector('a').addEventListener('click',function(e){ e.preventDefault(); abre('convite'); });
  /* Tab não escapa do diálogo enquanto ele está aberto */
  back.addEventListener('keydown',function(e){
    if(e.key!=='Tab'||back.hidden)return;
    var f=back.querySelectorAll('input,button,a[href],select,textarea');
    if(!f.length)return;
    var pri=f[0], ult=f[f.length-1];
    if(e.shiftKey&&document.activeElement===pri){e.preventDefault();ult.focus();}
    else if(!e.shiftKey&&document.activeElement===ult){e.preventDefault();pri.focus();}
  });

  // primeira visita: deixa o certificado aparecer antes de chamar a atenção
  if(!jaFechou)setTimeout(function(){abre('auto');},900);
})();
</script>

<script>
/* O holograma reage à inclinação: deviceorientation no celular, mousemove no desktop.
   As camadas do selo andam deslocando o gradientTransform; o cartão inclina junto. */
(function(){
  var card=document.getElementById('mrt-card');
  var seal=document.getElementById('mrt-seal');
  var gRb=document.getElementById('mrtRb');
  var gSp=document.getElementById('mrtSpec');
  var rbr=document.getElementById('mrt-rbr');
  if(!card||!seal||!gRb||!gSp||!rbr)return;
  /* "Reduzir movimento" tira a ROTAÇÃO do cartão, que é o que embrulha o estômago de quem
     precisa da opção. O brilho do selo e a sombra continuam reagindo: são cor e luz, não
     deslocamento. Antes isto desligava a página inteira e ela parecia quebrada. */
  var reduz=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var LIM_X=19, LIM_Y=22;

  function aplicar(rx,ry){
    rx=Math.max(-LIM_X,Math.min(LIM_X,rx));
    ry=Math.max(-LIM_Y,Math.min(LIM_Y,ry));
    var m=Math.min(1,Math.sqrt(rx*rx+ry*ry)/24);

    if(!reduz)card.style.transform='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';

    /* A sombra foge do lado que levanta e engorda conforme o cartão inclina. */
    var sx=(-ry*1.7).toFixed(1), sy=(18+rx*1.7).toFixed(1);
    card.style.boxShadow=
      sx+'px '+sy+'px '+(46+m*30).toFixed(0)+'px rgba(46,12,0,'+(.40+m*.18).toFixed(2)+'),'+
      (sx/2.4).toFixed(1)+'px '+(sy/2.4).toFixed(1)+'px '+(14+m*10).toFixed(0)+'px rgba(46,12,0,.22),'+
      '0 2px 0 rgba(255,255,255,.55) inset';

    // a faixa de luz corre pro lado oposto ao que o cartão levanta
    card.style.setProperty('--luz-x',(ry*11).toFixed(1)+'px');
    card.style.setProperty('--luz-y',(-rx*11).toFixed(1)+'px');

    gRb.setAttribute('gradientTransform','translate('+(ry*15).toFixed(2)+','+(-rx*15).toFixed(2)+')');
    gSp.setAttribute('gradientTransform','translate('+(-ry*16).toFixed(2)+','+(rx*16).toFixed(2)+')');
    rbr.setAttribute('opacity',(.44+m*.32).toFixed(2));
    seal.style.filter='drop-shadow(0 3px 5px rgba(28,26,24,.3)) saturate('+(1+m*.6).toFixed(2)+') brightness('+(.95+m*.22).toFixed(2)+')';
  }

  /* Um repintar por quadro, não por evento. A sombra é blur grande e obriga paint de
     verdade (o transform não obrigava); o deviceorientation dispara perto de 60 Hz no
     celular e o mousemove mais ainda. Ver reference_maratu_home_custo_cpu. */
  var alvoX=0, alvoY=0, agendado=false;
  function mirar(rx,ry){
    alvoX=rx; alvoY=ry;
    if(agendado)return;
    agendado=true;
    requestAnimationFrame(function(){ agendado=false; aplicar(alvoX,alvoY); });
  }

  aplicar(0,0);

  /* O mousemove escuta no DOCUMENTO, não no palco. Quando o selo abre em tela cheia o
     palco fica inert e para de receber evento de ponteiro — o holograma congelava justo na
     hora em que a pessoa quer olhar pra ele de perto. Com o popup de registro aberto aí sim
     fica parado: ali o cartão está atrás de um modal e não é o assunto. */
  document.addEventListener('mousemove',function(e){
    if(window.__mrtModais.tem('registro'))return;
    var w=window.innerWidth||1, h=window.innerHeight||1;
    mirar(-((e.clientY/h)-.5)*34,((e.clientX/w)-.5)*40);
  });
  document.addEventListener('mouseleave',function(){mirar(0,0);});

  /* O deviceorientation entrega beta/gamma no referencial do APARELHO, não no da tela.
     No iPad deitado, gamma fica perto de ±90 e beta perto de 0 — com a conta antiga os dois
     eixos saturavam no limite e o cartão ficava pregado, parecendo travado.

     Duas correções: girar o vetor conforme o ângulo da tela, e medir o DELTA a partir de
     como a pessoa está segurando (a primeira leitura vira o zero), em vez de supor 45°.
     Assim funciona em pé, deitado, e com a pessoa jogada no sofá. */
  var base=null, anguloTela=0;
  function leAnguloTela(){
    var a=(window.screen&&window.screen.orientation&&window.screen.orientation.angle);
    if(a==null)a=window.orientation;
    return ((Number(a)||0)%360+360)%360;
  }
  function ouvir(){
    anguloTela=leAnguloTela();
    function virou(){ anguloTela=leAnguloTela(); base=null; }   // referencial mudou, recalibra
    window.addEventListener('orientationchange',virou);
    if(window.screen&&window.screen.orientation&&window.screen.orientation.addEventListener)
      window.screen.orientation.addEventListener('change',virou);

    window.addEventListener('deviceorientation',function(ev){
      if(ev.beta===null||ev.gamma===null)return;
      if(!base){ base={b:ev.beta,g:ev.gamma}; return; }
      var db=ev.beta-base.b, dg=ev.gamma-base.g;
      var x,y;
      if(anguloTela===90){ x=-dg; y=db; }
      else if(anguloTela===180){ x=-db; y=-dg; }
      else if(anguloTela===270){ x=dg; y=-db; }
      else { x=db; y=dg; }
      mirar(x*.95,y*.95);
    });
  }
  /* No iPhone o sensor só liga depois de um gesto. Pedimos no primeiro toque da página. */
  if(window.DeviceOrientationEvent){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      /* Na captura: o primeiro toque pode ser no selo, que segura a propagação pra abrir
         a lupa. Escutando na descida o pedido de permissão sai de qualquer jeito. */
      document.addEventListener('click',function iniciar(){
        DeviceOrientationEvent.requestPermission().then(function(s){
          if(s==='granted')ouvir();
        }).catch(function(){});
        document.removeEventListener('click',iniciar,true);
      },true);
    } else {
      ouvir();
    }
  }

  /* ---- selo em tela cheia ---- */
  /* O selo é MOVIDO pro fundo escuro, não clonado: os gradientes viajam junto dentro do
     próprio <defs> e não há dois elementos disputando o mesmo id. */
  var lugar=seal.parentNode, lupa=null, porTeclado=false;
  seal.setAttribute('role','button');
  seal.setAttribute('tabindex','0');
  seal.setAttribute('aria-label','Ver o selo de autenticidade de perto');

  /* Safari do iPhone ignora overflow:hidden no body pra gesto de toque: o fundo rola
     atrás do overlay. Barrar o touchmove no próprio overlay é o que funciona lá. */
  function barraToque(e){ e.preventDefault(); }

  function abrirLupa(){
    if(lupa)return;
    lupa=document.createElement('div');
    lupa.className='selo-lupa';
    lupa.setAttribute('role','dialog');
    lupa.setAttribute('aria-modal','true');
    lupa.setAttribute('aria-label','Selo de autenticidade');
    lupa.tabIndex=-1;
    lupa.innerHTML='<p class="selo-lupa-dica">toque pra voltar</p>';
    seal.setAttribute('tabindex','-1');   // some do Tab enquanto está ampliado
    lupa.appendChild(seal);
    document.body.appendChild(lupa);
    lupa.addEventListener('touchmove',barraToque,{passive:false});
    // o certificado atrás sai do caminho do Tab e do leitor de tela enquanto isto está aberto
    window.__mrtModais.entra('lupa');
    void lupa.offsetWidth;          // força o quadro inicial antes de animar
    lupa.classList.add('on');
    try{lupa.focus({preventScroll:true});}catch(e){}
    if(typeof gtag==='function'){
      var alvo=document.querySelector('[data-estado]');
      gtag('event','selo_lupa',{estado:alvo?alvo.getAttribute('data-estado'):'desconhecido'});
    }
  }
  function fecharLupa(){
    if(!lupa)return;
    var indo=lupa;
    lupa=null;
    indo.classList.remove('on');
    window.__mrtModais.sai('lupa');
    /* Espera a volta do selo terminar (transform de .72s) antes de arrancá-lo do overlay,
       senão ele teleporta pro cartão no meio do caminho. O timer é a rede de segurança
       pra quando o transitionend não vem. */
    var devolveu=false;
    var devolver=function(){
      if(devolveu)return;
      devolveu=true;
      indo.removeEventListener('touchmove',barraToque);
      seal.setAttribute('tabindex','0');   // de volta ao cartão, volta pro Tab
      lugar.insertBefore(seal,lugar.firstChild);
      indo.remove();
      if(porTeclado){try{seal.focus({preventScroll:true});}catch(e){}}
    };
    seal.addEventListener('transitionend',function fim(e){
      if(e.propertyName!=='transform')return;
      seal.removeEventListener('transitionend',fim);
      devolver();
    });
    setTimeout(devolver,820);
  }
  seal.addEventListener('click',function(e){
    e.stopPropagation();
    if(lupa)fecharLupa(); else abrirLupa();
  });
  seal.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){
      e.preventDefault();
      porTeclado=true;              // só devolve o foco pro selo quem chegou por teclado
      if(lupa)fecharLupa(); else abrirLupa();
    }
  });
  document.addEventListener('click',function(e){
    if(lupa&&e.target!==seal&&!seal.contains(e.target))fecharLupa();
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&window.__mrtModais.topo()==='lupa')fecharLupa();
  });
})();
</script>
