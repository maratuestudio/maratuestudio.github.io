<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MARATU Estúdio — Links</title>
  <meta name="description" content="MARATU Estúdio — Impressão 3D, Design e Arte de Aracaju. Loja, encomendas e mais.">
  <link rel="icon" href="/favicon-v6.png">
  <meta name="robots" content="noindex">
  <style>
    @font-face { font-family: 'Clother'; src: url('/TRYClother-Bold.woff2') format('woff2'), url('/TRYClother-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Clother'; src: url('/TRYClother-Black.woff2') format('woff2'), url('/TRYClother-Black.ttf') format('truetype'); font-weight: 900; font-display: swap; }
    :root { --areia:#F0ECE4; --preto:#0D0D0B; --laranja:#C8501A; --dourado:#D4960A; --azul:#0E3272; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; }
    body { background: var(--areia); font-family: 'Clother', 'Helvetica Neue', sans-serif; color: var(--preto); }

    /* FUNDO — provisorio, areia como o site. Aqui vai entrar o video/GIF depois. */
    .bio-bg { position: fixed; inset: 0; z-index: 0; background: var(--areia); }

    .bio { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      padding: calc(56px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom)); }

    /* HEADER — lockup OFICIAL do hero: MARATU + ESTUDIO pequeno, alinhado a ESQUERDA */
    .bio-head { margin-bottom: 36px; }
    .lockup { font-size: clamp(34px, 9.5vw, 46px); line-height: 0.88; }
    .lockup-logo { display: block; width: 6em; max-width: 100%; height: auto; }
    /* sprite CORTADO (sem margem transparente) -> alinha flush com margin-left:0, robusto em qualquer browser */
    .lockup-estudio { display: block; width: 1.9em; aspect-ratio: 4.4801; overflow: hidden;
      margin-top: 0.02em; margin-left: 2px; line-height: 0; }
    /* ESTUDIO e um sketch branco; no fundo claro invertemos pra escuro (mantem o mesmo desenho).
       Sprite VERTICAL (frames empilhados) -> anima em Y, sem borda lateral/sliver. */
    .lockup-estudio img { display: block; width: 100%; height: 400%; max-width: none; filter: invert(1);
      animation: estudio-boil 0.28s steps(4) infinite; }
    @keyframes estudio-boil { to { transform: translateY(-100%); } }
    .bio-tag { margin-top: 18px; font-weight: 700; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(13,13,11,0.5); }

    /* LINKS — pills no MESMO estilo do site (.btn-encomendar): 999px, borda 1.5px preta, sombra dura 3px */
    .bio-links { display: flex; flex-direction: column; gap: 12px; }
    .bio-btn { display: block; width: 100%; text-align: center; text-decoration: none;
      font-family: 'Clother', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.11em; text-transform: uppercase;
      color: var(--preto); background: #fff;
      padding: 14px 20px; border-radius: 999px;
      border: 1.5px solid var(--preto); box-shadow: 3px 3px 0 0 var(--preto);
      transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .bio-btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 0 var(--preto); }
    .bio-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 0 var(--preto); }
    .bio-btn--primary { background: var(--dourado); }

    .bio-social { display: flex; gap: 12px; }
    .bio-social .bio-btn { padding: 12px 14px; font-size: 11px; }

    .bio-foot { margin-top: auto; padding-top: 34px;
      font-weight: 700; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(13,13,11,0.45); }
    .bio-foot a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <div class="bio-bg"><!-- video/GIF de fundo entra aqui --></div>

  <main class="bio">
    <header class="bio-head">
      <h1 class="lockup">
        <img class="lockup-logo" src="/maratu-logo.svg" alt="MARATU">
        <span class="lockup-estudio"><img src="/estudio-bio.webp?v=1" alt="Estúdio"></span>
      </h1>
      <p class="bio-tag">Impressão 3D · Design · Arte · Aracaju/SE</p>
    </header>

    <nav class="bio-links">
      <a class="bio-btn bio-btn--primary" href="/go/loja?s=maratu">Conheça a loja</a>
      <a class="bio-btn" href="/go/wpp?s=maratu">Peça sua encomenda personalizada</a>
      <a class="bio-btn" href="/go/news?s=maratu">Assine nossa newsletter</a>
      <a class="bio-btn" href="/go/agenda?s=maratu">Agenda cultural · onde vamos estar</a>
      <a class="bio-btn" href="/go/parceiros?s=maratu">Nossos parceiros</a>
      <div class="bio-social">
        <a class="bio-btn" href="/go/ig?s=maratu">Instagram</a>
        <a class="bio-btn" href="/go/tiktok?s=maratu">TikTok</a>
      </div>
    </nav>

    <footer class="bio-foot"><a href="/go/loja?s=maratu">maratu.com.br</a> · 2026 · Projeta o Mangue!</footer>
  </main>
</body>
</html>
