<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MARATU Estúdio — Links</title>
  <meta name="description" content="MARATU Estúdio — Impressão 3D, Design e Arte de Aracaju. Loja, encomendas e mais.">
  <link rel="icon" href="/favicon-v6.png">
  <meta name="robots" content="noindex">
  <style>
    @font-face { font-family: 'Clother'; src: url('/TRYClother-Bold.woff2') format('woff2'), url('/TRYClother-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Clother'; src: url('/TRYClother-Black.woff2') format('woff2'), url('/TRYClother-Black.ttf') format('truetype'); font-weight: 900; font-display: swap; }
    :root { --areia:#F0ECE4; --preto:#0D0D0B; --laranja:#C8501A; --dourado:#D4960A; --azul:#0E3272; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; }
    body { background: #0D0D0B; font-family: 'Clother', 'Helvetica Neue', sans-serif; color: var(--areia); }

    /* FUNDO — provisorio (escuro c/ leve brilho no topo). Aqui vai entrar o video/GIF depois. */
    .bio-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background: radial-gradient(120% 70% at 50% 0%, #241d17 0%, #14100c 45%, #0D0D0B 100%); }
    /* quando tiver o video: <video class="bio-bg__video" ...> aqui, com object-fit:cover + um scrim por cima */

    .bio { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center;
      padding: calc(54px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom)); }

    /* HEADER: logo + ESTUDIO animado */
    .bio-head { text-align: center; margin-bottom: 34px; }
    .bio-logo { display: block; width: 232px; max-width: 74vw; height: auto; margin: 0 auto; }
    .bio-estudio { display: block; width: 132px; height: 34px; overflow: hidden; margin: 12px auto 0; }
    .bio-estudio img { display: block; height: 100%; width: 400%; max-width: none; animation: estudio-boil 0.28s steps(4) infinite; }
    @keyframes estudio-boil { to { transform: translateX(-100%); } }
    .bio-tag { margin-top: 16px; font-weight: 700; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(240,236,228,0.55); }

    /* LINKS */
    .bio-links { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    .bio-btn { display: block; width: 100%; padding: 17px 20px; border-radius: 14px;
      border: 1.5px solid var(--preto); box-shadow: 4px 4px 0 0 var(--preto);
      background: var(--areia); color: var(--preto);
      font-family: 'Clother', sans-serif; font-weight: 900; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase;
      text-align: center; text-decoration: none; transition: transform 0.12s ease, box-shadow 0.12s ease; }
    .bio-btn:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 0 var(--preto); }
    .bio-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 0 var(--preto); }
    .bio-btn--primary { background: var(--dourado); font-size: 15px; padding: 19px 20px; }

    .bio-social { display: flex; gap: 12px; margin-top: 2px; }
    .bio-social .bio-btn { padding: 14px 12px; font-size: 12px; }

    .bio-foot { margin-top: auto; padding-top: 34px; text-align: center;
      font-weight: 700; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(240,236,228,0.4); }
    .bio-foot a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <div class="bio-bg"><!-- video/GIF de fundo entra aqui --></div>

  <main class="bio">
    <header class="bio-head">
      <img class="bio-logo" src="/maratu-logo.svg" alt="MARATU">
      <span class="bio-estudio"><img src="/estudio-sprite.webp?v=1" alt="Estúdio"></span>
      <p class="bio-tag">Impressão 3D · Design · Arte · Aracaju/SE</p>
    </header>

    <nav class="bio-links">
      <a class="bio-btn bio-btn--primary" href="/go/loja?s=maratu">Ver a loja</a>
      <a class="bio-btn" href="/go/wpp?s=maratu">Encomenda sob medida</a>
      <a class="bio-btn" href="/go/news?s=maratu">Newsletter</a>
      <a class="bio-btn" href="/go/agenda?s=maratu">Agenda · onde encontrar</a>
      <a class="bio-btn" href="/go/parceiros?s=maratu">Parceiros que indicamos</a>
      <div class="bio-social">
        <a class="bio-btn" href="/go/ig?s=maratu">Instagram</a>
        <a class="bio-btn" href="/go/tiktok?s=maratu">TikTok</a>
      </div>
    </nav>

    <footer class="bio-foot"><a href="/go/loja?s=maratu">maratu.com.br</a></footer>
  </main>
</body>
</html>
