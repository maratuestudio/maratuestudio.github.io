<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MARATU · Divulgação</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/divulgacao/divulgacao.webmanifest">
  <meta name="theme-color" content="#C8501A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MARATU">
  <link rel="apple-touch-icon" href="/apple-touch-icon-v6.png">
  <link rel="icon" type="image/png" href="/favicon-v6.png">
  <style>

    /* ── FONTES ── */
    @font-face { font-family: 'Jack'; src: url('TRYJackAlpha-Regular.woff2?v=2') format('woff2'), url('TRYJackAlpha-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }

    @font-face { font-family: 'Clother'; src: url('TRYClother-Regular.woff2') format('woff2'), url('TRYClother-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }

    @font-face { font-family: 'Clother'; src: url('TRYClother-Bold.woff2') format('woff2'), url('TRYClother-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }

    @font-face { font-family: 'Clother'; src: url('TRYClother-Black.woff2') format('woff2'), url('TRYClother-Black.ttf') format('truetype'); font-weight: 900; font-display: swap; }

    @font-face { font-family: 'Clother'; src: url('TRYClother-Italic.woff2') format('woff2'), url('TRYClother-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; font-display: optional; }


    /* ── VARIÁVEIS ── */
    :root {
      --laranja: #C8501A;
      --azul: #0E3272;
      --azul-claro: #2E6FC4;
      --areia: #F0ECE4;
      --areia-sombra: #E5DFD3;
      --preto: #0D0D0B;
      --dourado: #D4960A;
      --mono: 'Clother', sans-serif;
      --jack: 'Jack', 'Arial Black', sans-serif;
      --clother: 'Clother', 'Helvetica Neue', sans-serif;
      --gutter: clamp(16px, 2vw, 32px);
      --margem: clamp(20px, 4vw, 56px);
      --secao-padding: clamp(56px, 9vh, 120px);
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background: var(--areia);
      scrollbar-color: rgba(200,80,26,0.6) transparent;
      scrollbar-width: thin;
      scroll-padding-top: 80px;
    }

    body {
      font-family: var(--clother);
      background: var(--areia);
      color: var(--preto);
      line-height: 1.5;
    }


    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      padding: 0 var(--margem);
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: 1fr auto;
      gap: var(--gutter);
      padding-top: 120px;
      padding-bottom: 72px;
      position: relative;
      overflow: hidden;
    }

    .hero__bg {
      position: absolute; inset: 0;
      overflow: hidden;
    }

    .hero__bg::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(13,13,11,0.15) 0%, rgba(13,13,11,0.96) 65%);
      z-index: 1;
    }

    .hero__bg-slide {
      position: absolute; inset: 0;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      opacity: 0; transition: opacity 1.2s ease;
    }

    .hero__bg-slide.ativo { opacity: 1; }

    .hero__label-tl {
      position: absolute; top: 64px; left: var(--margem);
      display: flex; flex-direction: column; gap: 4px;
      z-index: 2;
    }

    .hero__label-tr {
      position: absolute; top: 64px; right: var(--margem);
      text-align: right; z-index: 2;
    }

    .hero__title {
      grid-column: 1 / span 12; grid-row: 2;
      font-family: var(--jack);
      font-size: clamp(3rem, 11vw, 10rem);
      line-height: 0.88;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--laranja);
      align-self: end;
      position: relative; z-index: 2;
    }

    .hero__title .offset {
      display: block;
      margin-top: 0.08em;
      transform: translateX(0.02em);
      color: var(--areia);
      font-size: 0.42em;
      font-family: var(--clother);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
    }

    /* Subtitulo "Estudio" como GIF animado (sketch). Dimensionado pra casar tamanho/posicao
       do texto original: altura 1.16em (=cap-height do texto), alinhado a esquerda sob o M. */
    .hero__title .estudio-boil-wrap { margin-top: -0.05em; line-height: 0; overflow: hidden; width: 4.48em; height: 1.16em; margin-left: -0.12em; }

    .hero__title .estudio-boil { display: block; height: 100%; width: 400%; max-width: none; animation: estudio-boil 0.28s steps(4) infinite; }

    @keyframes estudio-boil { to { transform: translateX(-100%); } }

    .hero__title .hero__logo { display: block; width: 6em; height: auto; }

    .hero__subtitle {
      grid-column: 1 / span 7; grid-row: 3;
      font-size: clamp(0.9rem, 1.3vw, 1.1rem);
      color: rgba(240,236,228,0.6);
      line-height: 1.75;
      max-width: 52ch;
      align-self: end;
      position: relative; z-index: 2;
    }

    .hero__scroll {
      position: absolute; right: var(--margem); bottom: 32px;
      text-align: right;
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 12px;
      z-index: 2;
    }

    .hero__scroll-line {
      width: 1px; height: 56px;
      background: rgba(240,236,228,0.2);
      position: relative; overflow: hidden;
    }

    .hero__scroll-line::before {
      content: ''; position: absolute;
      top: -100%; left: 0; right: 0; height: 100%;
      background: var(--laranja);
      animation: scroll-tick 2.5s cubic-bezier(0.4,0,0.2,1) infinite;
    }


    /* ── MONO (utilitário) ── */
    .mono {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(240,236,228,0.4);
    }




    /* ── SCROLL REVEAL (fade puro) ── */
    .reveal {
      opacity: 0;
      transition: opacity 0.9s cubic-bezier(0.4,0,0.2,1);
    }

    .reveal.in { opacity: 1; }

    .reveal[data-delay="1"] { transition-delay: 0.15s; }

    .reveal[data-delay="2"] { transition-delay: 0.3s; }

    .reveal[data-delay="3"] { transition-delay: 0.45s; }

    @keyframes scroll-tick {
      0%   { top: -100%; }
      100% { top: 100%; }
    }

    /* ===== DIVULGACAO (kiosk) ===== */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden;background:var(--preto);overscroll-behavior:none}
    .deck{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;cursor:grab;user-select:none}
    .deck::-webkit-scrollbar{display:none}
    .deck.dragging{cursor:grabbing;scroll-snap-type:none}
    .panel{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;position:relative;overflow:hidden}
    .panel--hero .hero{min-height:100%;height:100%;padding-top:clamp(40px,7vh,90px)}
    .qr-card{position:absolute;right:var(--margem);bottom:72px;z-index:6;background:var(--areia);border:2px solid var(--preto);border-radius:22px;box-shadow:7px 7px 0 0 var(--preto);padding:clamp(14px,1.6vw,22px);display:flex;flex-direction:column;align-items:center;gap:10px;width:clamp(190px,24vw,280px);text-decoration:none;color:var(--preto)}
    .qr-card img{width:100%;height:auto;display:block;border-radius:6px}
    .qr-card__lbl{font-family:var(--mono);font-size:clamp(.56rem,.9vw,.7rem);letter-spacing:.16em;text-transform:uppercase;text-align:center;line-height:1.5}
    .qr-card__lbl b{font-weight:900}
    .swipe-hint{position:absolute;bottom:clamp(14px,2.6vh,28px);left:50%;transform:translateX(-50%);z-index:7;font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--areia);opacity:.92;background:none;border:none;cursor:pointer;animation:sh 1.8s ease-in-out infinite}
    @keyframes sh{0%,100%{transform:translateX(-50%)}50%{transform:translateX(calc(-50% + 7px))}}
    .swipe-hint.back{animation:shb 1.8s ease-in-out infinite}
    @keyframes shb{0%,100%{transform:translateX(-50%)}50%{transform:translateX(calc(-50% - 7px))}}
    .panel--pix{background:var(--laranja);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:clamp(30px,5vw,84px);padding:clamp(24px,5vw,80px);text-align:left}
    .pix__left{display:flex;flex-direction:column;align-items:flex-end;gap:clamp(12px,2.2vh,24px);max-width:min(46vw,560px)}
    .pix__eyebrow{font-family:var(--mono);font-size:clamp(.62rem,1vw,.8rem);letter-spacing:.28em;text-transform:uppercase;color:var(--areia);opacity:.9}
    .pix__title{font-family:var(--clother);font-weight:900;font-size:clamp(2.2rem,6.5vw,5.6rem);line-height:.9;letter-spacing:-.02em;text-transform:uppercase;color:var(--areia);text-align:right;text-shadow:.05em .05em 0 var(--preto)}
    .pix__card{background:var(--areia);border:2px solid var(--preto);border-radius:24px;box-shadow:8px 8px 0 0 var(--preto);padding:clamp(16px,2vw,30px);line-height:0}
    .pix__card img{width:clamp(190px,30vw,330px);height:auto;display:block;border-radius:8px}
    .pix__key{font-family:var(--mono);font-size:clamp(.7rem,1.4vw,1rem);letter-spacing:.1em;text-transform:uppercase;color:var(--areia);font-weight:700;cursor:pointer}
    .pix__key span{opacity:.75;font-weight:400}
    .pix__copied{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--areia);height:1em;opacity:0;transition:opacity .2s}
    .pix__copied.on{opacity:1}
    .aratu-pix{width:clamp(88px,12vw,150px);height:auto;line-height:0;margin-top:clamp(4px,1vh,12px)}
    .aratu-pix svg{width:100%;height:auto;overflow:visible;display:block}
    .aratu-pix path{fill:var(--areia)}


    @media (max-width:680px){ .panel--pix{flex-direction:column;text-align:center;gap:clamp(14px,2.4vh,28px)} .pix__left{align-items:center;max-width:none} .pix__title{text-align:center} .aratu-pix{margin-left:auto;margin-right:auto} }

    /* painel Pix ganha 2 dicas de arrastar (volta pro inicio / segue pra loja) */
    .panel--pix .swipe-hint{left:auto;transform:none}
    .panel--pix .swipe-hint.back{left:var(--margem);animation:shbL 1.8s ease-in-out infinite}
    .panel--pix .swipe-hint.fwd{right:var(--margem);animation:shR 1.8s ease-in-out infinite}
    @keyframes shbL{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}
    @keyframes shR{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}

    /* ── LOJA (painel 3) — produto grande a esquerda, valor grande a direita ── */
    .panel--loja{background:var(--azul)}
    .loja__label-tr{position:absolute;top:64px;right:var(--margem);text-align:right;z-index:3;display:flex;flex-direction:column;gap:4px}
    .loja__label-tr .loja__titulo{font-family:var(--clother);font-weight:900;font-size:clamp(1.1rem,1.9vw,1.7rem);letter-spacing:-.01em;text-transform:uppercase;color:var(--areia)}
    .loja__stage{position:absolute;inset:0}
    .lj-card{position:absolute;inset:0;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:clamp(28px,5vw,90px);padding:clamp(24px,5vw,80px);opacity:0;transform:translateX(28px);transition:opacity .6s ease,transform .6s ease;pointer-events:none}
    .lj-card.ativo{opacity:1;transform:translateX(0);pointer-events:auto}
    .lj-card__img{position:relative;width:clamp(220px,28vw,400px);aspect-ratio:1/1;flex-shrink:0;border-radius:18px;overflow:hidden;background:var(--areia);border:2px solid var(--preto);box-shadow:7px 7px 0 0 var(--preto)}
    .lj-card__img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    .lj-card__img--sticker{width:auto;height:clamp(240px,44vh,430px);aspect-ratio:875/1241}
    .lj-card__img--a3{width:auto;height:clamp(300px,56vh,540px);aspect-ratio:1131/1600}
    .lj-card__img--a4{width:auto;height:clamp(200px,38vh,370px);aspect-ratio:1131/1600}
    .lj-card__info{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(6px,1.2vh,16px);max-width:min(46vw,620px)}
    .lj-card__txt{display:contents}
    .lj-card__preco{display:flex;align-items:baseline;gap:4px;font-family:var(--clother);font-weight:900;font-size:clamp(2.2rem,6.5vw,5.6rem);line-height:.9;letter-spacing:-.02em;color:var(--areia);text-shadow:.05em .05em 0 var(--preto)}
    .lj-card__preco small{font-family:var(--clother);font-weight:700;font-size:.28em}
    .lj-card__nome{font-family:var(--clother);font-weight:900;font-size:clamp(2.2rem,6.5vw,5.6rem);line-height:.9;letter-spacing:-.02em;text-transform:uppercase;color:var(--areia);text-shadow:.05em .05em 0 var(--preto);order:-1}
    .lj-card__tipo{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(240,236,228,.6);order:1}
    .loja__dots{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
    .loja__dots span{width:6px;height:6px;border-radius:50%;background:rgba(240,236,228,.35)}
    .loja__dots span.ativo{background:var(--areia)}
    @media (max-width:680px){ .lj-card{flex-direction:column-reverse;text-align:center} .lj-card__info{align-items:center;max-width:none} }
    .brand-corner{position:fixed;left:var(--margem);bottom:clamp(20px,4vh,40px);z-index:20;font-size:clamp(22px,2.9vw,38px);pointer-events:none}
    .brand-corner__logo{display:block;width:6em;height:auto;filter:brightness(0) invert(1)}
    .brand-corner__est{display:block;overflow:hidden;width:3.3em;height:0.854em;margin-top:-0.05em;margin-left:-0.12em;line-height:0}
    .brand-corner__est .estudio-boil{display:block;height:100%;width:400%;max-width:none;animation:estudio-boil .28s steps(4) infinite}
    .qr-corner{position:fixed;top:50%;right:var(--margem);transform:translateY(-50%);z-index:20;opacity:0;visibility:hidden;transition:opacity .35s ease;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.6vh,18px)}
    .qr-corner.show{opacity:1;visibility:visible}
    .qr-corner__titulo{font-family:var(--jack);font-size:clamp(1.5rem,3vw,2.6rem);line-height:.92;letter-spacing:-.01em;text-transform:uppercase;color:var(--laranja);text-align:center}
    .qr-corner__card{background:var(--areia);border:2px solid var(--preto);border-radius:18px;box-shadow:6px 6px 0 0 var(--preto);padding:clamp(10px,1.2vw,16px);display:flex;flex-direction:column;align-items:center;gap:8px;width:clamp(128px,14vw,180px);text-decoration:none;color:var(--preto)}
    .qr-corner__card img{width:100%;height:auto;display:block;border-radius:5px}
    .qr-corner__lbl{font-family:var(--mono);font-size:clamp(.5rem,.8vw,.62rem);letter-spacing:.14em;text-transform:uppercase;text-align:center;line-height:1.5}
    .qr-corner__lbl b{font-weight:900}
  </style>
</head>
<body>
  <div class="deck" id="deck">
    <section class="panel panel--pix" id="pix">
      <div class="pix__left">
        <h1 class="pix__title">Pague<br>com Pix</h1>
        <div class="pix__key" id="pixKey" title="toque para copiar a chave"><span>chave</span> estudio@maratu.com.br</div>

        <svg viewBox="0 0 318.24 152.9" xmlns="http://www.w3.org/2000/svg">

          <g data-aratu="claw-right"><path d="M270.11,56.65v96.26c26.58,0,48.13-21.55,48.13-48.13s-21.55-48.13-48.13-48.13Z"/></g>

        </svg>
      </div>
      </div>

    <h2 class="qr-corner__titulo">Siga a<br>Maratu</h2>
    <a class="qr-corner__card" href="https://instagram.com/maratuestudio" target="_blank" rel="noopener" aria-label="Siga a MARATU no Instagram">
      <img src="/divulgacao/ig-qr.png?v=2" alt="QR do Instagram @maratuestudio" width="462" height="462">
      <span class="qr-corner__lbl">Siga no Instagram<br><b>@maratuestudio</b></span>

  <script>

    var heroSlides=document.querySelectorAll('.hero__bg-slide'),heroAtual=0;
    function heroEnsureBg(s){ if(s&&s.dataset.bg){ s.style.backgroundImage="url('"+s.dataset.bg+"')"; delete s.dataset.bg; } }
    if(heroSlides.length>1){ heroEnsureBg(heroSlides[1]);
      setInterval(function(){ var p=(heroAtual+1)%heroSlides.length; heroEnsureBg(heroSlides[p]); heroEnsureBg(heroSlides[(p+1)%heroSlides.length]); heroSlides[heroAtual].classList.remove('ativo'); heroAtual=p; heroSlides[heroAtual].classList.add('ativo'); },5000); }
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in'); });

    // SWIPE: toque usa scroll nativo; mouse usa drag-to-scroll
    var deck=document.getElementById('deck');
    (function(){
      var down=false,sx=0,sl=0,moved=false;
      deck.addEventListener('pointerdown',function(e){ if(e.pointerType!=='mouse')return; down=true;moved=false;sx=e.clientX;sl=deck.scrollLeft;deck.classList.add('dragging'); });
      window.addEventListener('pointermove',function(e){ if(!down)return; var dx=e.clientX-sx; if(Math.abs(dx)>4)moved=true; deck.scrollLeft=sl-dx; });
      window.addEventListener('pointerup',function(){ if(!down)return; down=false; deck.classList.remove('dragging'); var w=window.innerWidth; deck.scrollTo({left:Math.round(deck.scrollLeft/w)*w,behavior:'smooth'}); });
      deck.querySelectorAll('img,a').forEach(function(el){ el.setAttribute('draggable','false'); });
      // impede clique acidental do link apos arraste
    })();
    function goTo(i){ deck.scrollTo({left:i*window.innerWidth,behavior:'smooth'}); }
    // body herda a cor do painel visivel (o iPadOS "estende" o bg do body atras da barra de janela)
    var panelBg=['#C8501A','#0E3272'];
    function syncBg(){ var i=Math.round(deck.scrollLeft/window.innerWidth); document.body.style.background=panelBg[i]||panelBg[0]; var q=document.querySelector('.qr-corner'); if(q) q.classList.toggle('show', i===1); }
    deck.addEventListener('scroll',syncBg,{passive:true}); syncBg();
    document.getElementById('toLoja').addEventListener('click',function(){ goTo(1); });
    document.getElementById('toPixFromLoja').addEventListener('click',function(){ goTo(0); });

    // LOJA: troca os blocos de produto um por vez (fade+slide)
    (function(){
      var stage=document.getElementById('ljStage'); if(!stage)return;
      var cards=stage.querySelectorAll('.lj-card'); if(cards.length<2)return;
      var dotsWrap=document.getElementById('ljDots');
      cards.forEach(function(_,idx){ var d=document.createElement('span'); if(idx===0)d.className='ativo'; dotsWrap.appendChild(d); });
      var dots=dotsWrap.querySelectorAll('span');
      var i=0;
      setInterval(function(){
        cards[i].classList.remove('ativo'); dots[i].classList.remove('ativo');
        i=(i+1)%cards.length;
        cards[i].classList.add('ativo'); dots[i].classList.add('ativo');
      },3400);
    })();

    // ARATU respira + pisca 2x a cada 5s
    (function(){ var r=document.getElementById('aratuPix'); if(!r)return;
      var b=r.querySelector('[data-aratu="body"]'),el=r.querySelector('[data-aratu="eye-left"]'),er=r.querySelector('[data-aratu="eye-right"]'); if(!b||!el||!er)return;
      var t0=performance.now(),P=5000;
      function eyes(s){ el.setAttribute('transform','translate(105.5 24.08) scale(1 '+s+') translate(-105.5 -24.08)'); er.setAttribute('transform','translate(212.74 24.08) scale(1 '+s+') translate(-212.74 -24.08)'); }
      function bl(ph,st,d){ if(ph>=st&&ph<st+d){ var pr=(ph-st)/d; return pr<0.5?1-pr*2*0.9:0.1+(pr-0.5)*2*0.9; } return null; }
      (function f(now){ requestAnimationFrame(f); var br=1+Math.sin(now/600)*0.03; b.setAttribute('transform','translate(159.12 152.9) scale(1 '+br+') translate(-159.12 -152.9)'); var ph=(now-t0)%P; var s=bl(ph,0,150); if(s===null)s=bl(ph,240,150); eyes(s===null?1:s); })(performance.now());
    })();

    // ALWAYS ON
    var _wl=null; async function lock(){ try{ if('wakeLock' in navigator){ _wl=await navigator.wakeLock.request('screen'); } }catch(e){} }
    document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible')lock(); }); lock();
    window.addEventListener('pointerdown',function o(){ lock(); window.removeEventListener('pointerdown',o); });
    // TELA CHEIA no 1o toque (fora do PWA)
    function full(){ var el=document.documentElement,r=el.requestFullscreen||el.webkitRequestFullscreen; if(r){ try{ var p=r.call(el); if(p&&p.catch)p.catch(function(){}); }catch(e){} } }
    var st=matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone;
    if(!st){ window.addEventListener('pointerdown',function o(){ full(); window.removeEventListener('pointerdown',o); }); }
    // copiar chave
    var pk=document.getElementById('pixKey'),pc=document.getElementById('pixCopied');
    if(pk){ pk.addEventListener('click',function(){ try{ navigator.clipboard.writeText('estudio@maratu.com.br'); pc.classList.add('on'); setTimeout(function(){pc.classList.remove('on')},1600); }catch(e){} }); }
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('/divulgacao/sw.js',{scope:'/divulgacao/'}).catch(function(){}); }

  </script>
</body>
