  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <script>
    /* Anti-enquadramento. O certo seria o cabecalho frame-ancestors, mas ele so vale como
       cabecalho de verdade e o GitHub Pages nao manda cabecalho. Enquanto nao houver uma
       Transform Rule na Cloudflare, isto resolve o caso pratico: se a pagina for aberta
       dentro de um iframe de outro site, ela tenta escapar; se o navegador barrar, ela se
       apaga em vez de servir de isca. */
    (function () {
      if (window.top === window.self) return;
      try { window.top.location.replace(window.self.location.href); }
      catch (e) {
        document.addEventListener("DOMContentLoaded", function () {
          document.body.innerHTML = "";
          document.body.style.background = "#0D0D0B";
        });
      }
    })();
  </script>

<style>
@font-face { font-family: "Clother"; src: url("TRYClother-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Clother"; src: url("TRYClother-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Clother"; src: url("TRYClother-Black.woff2") format("woff2"); font-weight: 900; font-display: swap; }
@font-face { font-family: "Jack"; src: url("TRYJackAlpha-Regular.woff2?v=2") format("woff2"); font-weight: 400; font-display: swap; }

/* entrada no conceito do painel novo: caderno areia, um cartão, o Aratu dormindo em cima */
:root {
  --tela: #E8E2D6; --cartao: #F7F4EE; --campo: #FFFFFF; --tinta: #0D0D0B;
  --suave: rgba(13,13,11,.6); --grade: rgba(13,13,11,.07); --borda: #0D0D0B; --sombra: #0D0D0B;
  --acento: #C8501A; --erro: #B23A2E;
  --font: "Clother", "Helvetica Neue", Arial, sans-serif;
  --mola: cubic-bezier(.2, .9, .25, 1);
}
:root[data-theme="laranja"] { --tela: #C8501A; --cartao: #F0ECE4; --grade: rgba(13,13,11,.12); --acento: #0D0D0B; }
:root[data-theme="noite"] {
  --tela: #0D0D0B; --cartao: #1F1F1B; --campo: #14140F; --tinta: #F0ECE4; --suave: rgba(240,236,228,.6);
  --grade: rgba(240,236,228,.06); --borda: rgba(240,236,228,.3); --sombra: rgba(240,236,228,.22); --acento: #2E6FC4; --erro: #E0705F;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); color: var(--tinta); -webkit-font-smoothing: antialiased;
  background-color: var(--tela);
  background-image: linear-gradient(to right, var(--grade) 1px, transparent 1px), linear-gradient(to bottom, var(--grade) 1px, transparent 1px);
  background-size: 28px 28px;
  display: grid; place-items: center; min-height: 100dvh;
  padding: calc(env(safe-area-inset-top, 0px) + 56px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
}
button { font: inherit; color: inherit; cursor: pointer; }
.cartao {
  width: 100%; max-width: 400px; position: relative;
  background: var(--cartao); border: 1.5px solid var(--borda); border-radius: 20px; box-shadow: 3px 3px 0 var(--sombra);
  padding: 24px 20px 18px; transition: transform .45s var(--mola), opacity .35s;
}
html.conferindo .cartao { visibility: hidden; }
.cartao.entra { transform: scale(.96); opacity: 0; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.aratu { position: absolute; top: -30px; right: 22px; width: 66px; }
.zz { position: absolute; top: -52px; right: 6px; width: 30px; }
.cab { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1.5px solid var(--borda); padding-bottom: 14px; margin-bottom: 18px; }
.marca { font-family: "Jack", var(--font); font-size: 34px; line-height: 1; letter-spacing: .01em; }
.cab small { font-size: 13px; font-weight: 900; color: var(--suave); }
.data { font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); }
.oi { margin: 4px 0 20px; font-size: 32px; font-weight: 900; line-height: 1; letter-spacing: -.02em; }

.bt {
  min-height: 52px; width: 100%; padding: 0 18px; border-radius: 14px; border: 1.5px solid var(--borda);
  background: var(--campo); font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 2px 2px 0 var(--sombra); transition: transform .12s, box-shadow .12s, opacity .2s;
}
.bt:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--sombra); }
.bt svg { width: 22px; height: 22px; flex: none; }
.bt.preto { background: var(--tinta); color: var(--cartao); }
.bt:disabled { opacity: .5; cursor: wait; }
.bt-link { background: none; border: 0; padding: 12px 4px; font-size: 15px; font-weight: 900; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; min-height: 44px; justify-self: center; }
.bt:focus-visible, .bt-link:focus-visible, .olho:focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; }
.acoes { display: grid; gap: 6px; justify-items: center; }

.form { display: grid; gap: 14px; }
.campo { display: grid; gap: 6px; }
.campo label { font-size: 12.5px; font-weight: 900; color: var(--suave); }
.caixa { position: relative; }
.campo input { width: 100%; min-height: 52px; padding: 12px 52px 12px 14px; border: 1.5px solid var(--borda); border-radius: 14px; background: var(--campo); font: inherit; font-size: 17px; color: var(--tinta); -webkit-appearance: none; appearance: none; }
.campo input:focus { outline: 2px solid var(--acento); outline-offset: 2px; }
.olho { position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; color: var(--suave); }
.olho svg { width: 22px; height: 22px; }

/* código de 6 dígitos: um input só, seis casas desenhadas por baixo */
.codigo { position: relative; height: 60px; }
.casas { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; pointer-events: none; }
.casas span { border: 1.5px solid var(--borda); border-radius: 12px; background: var(--campo); display: grid; place-items: center; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.casas span.vez { outline: 2px solid var(--acento); outline-offset: 2px; }
.codigo input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; }

.msg { margin: 12px 0 0; min-height: 20px; font-size: 14px; font-weight: 700; color: var(--suave); text-align: center; }
.msg.erro { color: var(--erro); }
.oculto { display: none !important; }
.treme { animation: treme .38s; }
@keyframes treme { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.pe { margin-top: 14px; font-size: 12.5px; font-weight: 700; color: var(--suave); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="cartao" id="cartao">
  <canvas class="px aratu" id="aratu" width="30" height="19" aria-hidden="true"></canvas>
  <canvas class="px zz" id="zz" width="10" height="12" aria-hidden="true"></canvas>
  <div class="cab"><span class="marca">maratu</span><small>painel</small></div>
  <div class="data" id="data"></div>
  <h1 class="oi" id="oi">Olá, Raphael</h1>

  <div id="passo1" class="acoes">
    <button class="bt preto" id="pkBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9v1.5M15 9v1.5M12 9v4h-1M9.5 16c1.5 1 3.5 1 5 0"/></svg>
      <span id="pkRot">Entrar com Face ID</span>
    </button>
    <button class="bt-link" id="btSenha" type="button">Usar senha</button>
  </div>

  <form id="loginForm" class="form oculto" autocomplete="on">
    <input type="text" name="username" value="raphael" autocomplete="username" hidden />
    <div class="campo"><label for="loginSenha">Senha</label>
      <div class="caixa"><input id="loginSenha" type="password" autocomplete="current-password" />
        <button class="olho" id="olho" type="button" aria-label="Mostrar senha"></button></div></div>
    <button class="bt preto" type="submit" id="loginBtn">Entrar</button>
    <button class="bt-link" id="voltaPk" type="button">Usar Face ID</button>
  </form>

  <form id="totpForm" class="form oculto" autocomplete="off">
    <div class="campo"><label for="loginTotp">Código do app autenticador</label>
      <div class="codigo"><div class="casas" id="casas"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <input id="loginTotp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" /></div></div>
    <button class="bt-link" id="voltaSenha" type="button">Voltar para a senha</button>
  </form>

  <p class="msg" id="loginMsg" aria-live="polite"></p>
  <div class="pe">Painel da MARATU, Aracaju</div>
</main>

<script>
(function () {
  var API = "https://maratu-api.raphaelnascimento.workers.dev";
  var $ = function (id) { return document.getElementById(id); };
  var cartao = $("cartao"), msg = $("loginMsg");
  var senha = $("loginSenha"), totp = $("loginTotp"), casas = $("casas");
  var pkBtn = $("pkBtn"), btSenha = $("btSenha"), loginBtn = $("loginBtn");

  /* data e saudação */
  var agora = new Date(), h = agora.getHours();
  $("data").textContent = agora.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }).replace("-feira", "");
  $("oi").textContent = (h < 5 ? "Boa noite" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + ", Raphael";

  /* no Mac é o Touch ID */
  var mac = /Macintosh/.test(navigator.userAgent) && !("ontouchend" in document);
  var nomeBio = mac ? "Touch ID" : "Face ID";
  $("pkRot").textContent = "Entrar com " + nomeBio;
  $("voltaPk").textContent = "Usar " + nomeBio;

  var IC_OLHO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var IC_OLHO_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.6 3.4M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  $("olho").innerHTML = IC_OLHO;

  /* ---------- o Aratu em pixel: as formas do logo, como no painel ---------- */
  var P = {
    garraE: "M0,104.77c0,26.58,21.55,48.13,48.13,48.13V56.65C21.55,56.65,0,78.19,0,104.77Z",
    garraD: "M270.11,56.65v96.26c26.58,0,48.13-21.55,48.13-48.13s-21.55-48.13-48.13-48.13Z",
    corpo: "M159.12,152.9c53.16,0,96.26-43.1,96.26-96.26H62.86c0,53.16,43.1,96.26,96.26,96.26Z",
    olhoD: "M224.82,24.08c0-13.3-10.78-24.08-24.08-24.08v48.16c13.3,0,24.08-10.78,24.08-24.08Z",
    olhoE: "M117.49,48.16V0c-13.3,0-24.08,10.78-24.08,24.08s10.78,24.08,24.08,24.08Z"
  };
  var cv = $("aratu"), zz = $("zz");
  var est = { pisca: false, tapa: false, dorme: true, pulo: 0 };
  var cor = getComputedStyle(document.documentElement).getPropertyValue("--tinta").trim() || "#0D0D0B";
  function desenha() {
    var ctx = cv.getContext("2d"), K = cv.width / 318.24;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.save(); ctx.scale(K, K); ctx.translate(0, 40 - est.pulo); ctx.fillStyle = cor;
    var peca = function (n, dx, dy) { ctx.save(); ctx.translate(dx, dy); ctx.fill(new Path2D(P[n])); ctx.restore(); };
    peca("corpo", 0, 6);
    if (est.dorme || est.pisca) { ctx.fillRect(93, 34, 25, 12); ctx.fillRect(200, 34, 25, 12); }
    else { peca("olhoE", 0, 6); peca("olhoD", 0, 6); }
    if (est.tapa) { peca("garraE", 72, -66); peca("garraD", -72, -66); }
    else { peca("garraE", 0, 6); peca("garraD", 0, -8); }
    ctx.restore();
    var img = ctx.getImageData(0, 0, cv.width, cv.height), px = img.data;
    for (var i = 3; i < px.length; i += 4) px[i] = px[i] > 110 ? 255 : 0;
    ctx.putImageData(img, 0, 0);
  }
  function desenhaZ(fase) {
    var ctx = zz.getContext("2d"); ctx.clearRect(0, 0, zz.width, zz.height); ctx.fillStyle = cor;
    var z = function (x, y) { ctx.fillRect(x, y, 4, 1); ctx.fillRect(x + 2, y + 1, 1, 1); ctx.fillRect(x + 1, y + 2, 1, 1); ctx.fillRect(x, y + 3, 4, 1); };
    if (fase > 0) z(1, 7); if (fase > 1) z(5, 1);
  }
  var reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function pula() {
    if (reduz) return desenha();
    var i = 0, alt = [18, 30, 34, 30, 18, 0];
    (function salto() { est.pulo = alt[i++] || 0; desenha(); if (i < alt.length) setTimeout(salto, 45); })();
  }
  function acorda() { if (!est.dorme) return; est.dorme = false; zz.style.visibility = "hidden"; pula(); }
  function tapa(sim) { if (est.tapa === sim) return; est.tapa = sim; desenha(); }
  /* 4 quadros por segundo bastam: o zz e uma piscada de vez em quando */
  var zf = 0;
  setInterval(function () {
    if (document.hidden) return;
    if (est.dorme) { zf = (zf + 1) % 6; desenhaZ(zf < 3 ? zf : 2); }
    else if (!est.tapa) { var p = Math.random() < 0.04; if (p !== est.pisca) { est.pisca = p; desenha(); } }
  }, 260);
  desenha(); desenhaZ(2);

  /* ---------- telas ---------- */
  function aviso(t, tipo) { msg.textContent = t || ""; msg.classList.toggle("erro", tipo === "erro"); }
  function mostra(qual) {
    $("passo1").classList.toggle("oculto", qual !== 1);
    $("loginForm").classList.toggle("oculto", qual !== 2);
    $("totpForm").classList.toggle("oculto", qual !== 3);
  }
  function treme(el) { el.classList.remove("treme"); void el.offsetWidth; el.classList.add("treme"); }
  function irSenha() { acorda(); mostra(2); senha.focus(); }

  /* Se veio de expiração ou de sair, avisa */
  (function () {
    var p = new URLSearchParams(location.search);
    if (p.get("expired") === "1") aviso("A sessão expirou. Entre de novo.");
    else if (p.get("logout") === "1") aviso("Você saiu.");
  })();

  function destino() {
    try { var v = localStorage.getItem("maratu.volta"); localStorage.removeItem("maratu.volta"); if (v === "/admin.html") return v; } catch (e) {}
    return "/painel.html";
  }
  function entrou(sess) {
    try { localStorage.setItem("maratu.token", sess); } catch (e) {}
    aviso("Abrindo o painel");
    est.tapa = false; if (est.dorme) acorda(); else pula();
    var vai = destino();
    setTimeout(function () { cartao.classList.add("entra"); }, 220);
    setTimeout(function () { location.replace(vai); }, reduz ? 0 : 520);
  }

  /* Se já tem token válido salvo, entra direto. Senão fica no cartão. */
  (async function () {
    var tk = null;
    try { tk = localStorage.getItem("maratu.token"); } catch (e) {}
    var mostra = function () { document.documentElement.classList.remove("conferindo"); };
    if (!tk) return mostra();
    try {
      var r = await fetch(API + "/api/state", { headers: { Authorization: "Bearer " + tk } });
      if (r.ok) return location.replace(destino());
      if (r.status === 401) { try { localStorage.removeItem("maratu.token"); } catch (e) {} }
    } catch (e) {}
    mostra();
  })();

  /* ---------- senha + 2FA ---------- */
  btSenha.onclick = irSenha;
  $("voltaPk").onclick = function () { tapa(false); mostra(1); aviso(""); };
  $("voltaSenha").onclick = function () { totp.value = ""; pintaCasas(); mostra(2); aviso(""); senha.focus(); };
  senha.addEventListener("focus", function () { if (senha.type === "password") tapa(true); });
  senha.addEventListener("blur", function () { tapa(false); });
  $("olho").onclick = function () {
    var ver = senha.type === "password"; senha.type = ver ? "text" : "password";
    this.innerHTML = ver ? IC_OLHO_X : IC_OLHO; this.setAttribute("aria-label", ver ? "Esconder senha" : "Mostrar senha");
    tapa(!ver); senha.focus();
  };

  var enviando = false;
  async function enviar() {
    var pw = (senha.value || "").trim();
    if (!pw || enviando) return;
    var cod = (totp.value || "").trim();
    enviando = true; loginBtn.disabled = true; aviso("");
    try {
      var headers = { Authorization: "Bearer " + pw };
      if (cod) headers["X-TOTP-Code"] = cod;
      var r = await fetch(API + "/api/state", { credentials: "include", headers: headers });
      if (r.status === 401) {
        var body = {};
        try { body = await r.json(); } catch (e) {}
        if (body.error === "totp_required") {
          tapa(false); mostra(3); totp.focus(); pintaCasas();
          aviso("Abra o autenticador e digite os 6 números"); return;
        }
        if (body.error === "totp_invalid") {
          mostra(3); totp.value = ""; pintaCasas(); totp.focus();
          aviso("Código errado ou vencido. Digite o que está na tela agora.", "erro"); treme($("totpForm")); return;
        }
        mostra(2); aviso("Senha incorreta", "erro"); treme($("loginForm"));
        senha.value = ""; totp.value = ""; senha.focus(); return;
      }
      if (!r.ok) { aviso("O servidor respondeu " + r.status + ". Tente de novo.", "erro"); return; }
      /* Guarda a SESSAO que o /api/state devolve, nao a senha. Guardando a senha, o token
         mestre ficava no aparelho e o portao passava a exigir X-TOTP-Code em toda chamada
         assim que o 2FA fosse ligado — o admin respondia 401 em tudo. */
      var sess = "";
      try { var j = await r.json(); sess = j && j.session ? j.session : ""; } catch (e) {}
      entrou(sess || pw);
    } catch (e) {
      aviso("Sem conexão. Confira a internet e tente de novo.", "erro");
    } finally { enviando = false; loginBtn.disabled = false; }
  }
  $("loginForm").addEventListener("submit", function (e) { e.preventDefault(); enviar(); });
  $("totpForm").addEventListener("submit", function (e) { e.preventDefault(); enviar(); });
  function pintaCasas() {
    var v = totp.value.replace(/\D/g, "").slice(0, 6);
    if (v !== totp.value) totp.value = v;
    var foco = document.activeElement === totp;
    [].forEach.call(casas.children, function (s, i) { s.textContent = v[i] || ""; s.classList.toggle("vez", foco && i === Math.min(v.length, 5)); });
    return v;
  }
  totp.addEventListener("input", function () { if (pintaCasas().length === 6) { totp.blur(); enviar(); } });
  totp.addEventListener("focus", pintaCasas);
  totp.addEventListener("blur", pintaCasas);

  /* ---------- Face ID / Touch ID (passkey) ---------- */
  if (!window.PublicKeyCredential) { mostra(2); $("voltaPk").classList.add("oculto"); acorda(); }
  var b64url = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  var toBuf = function (s) { s = String(s).replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var bin = atob(s); var u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
  pkBtn.addEventListener("click", async function () {
    acorda(); pkBtn.disabled = true; aviso("");
    try {
      var r = await fetch(API + "/api/webauthn/login/options", { method: "POST" });
      if (!r.ok) throw new Error("options " + r.status);
      var opt = await r.json();
      if (!opt.allowCredentials || !opt.allowCredentials.length) {
        pkBtn.disabled = false; irSenha(); aviso("Nenhum " + nomeBio + " cadastrado ainda. Entre com a senha."); return;
      }
      var a = await navigator.credentials.get({ publicKey: { challenge: toBuf(opt.challenge), rpId: opt.rpId, timeout: opt.timeout, userVerification: opt.userVerification, allowCredentials: opt.allowCredentials.map(function (c) { return { type: c.type, id: toBuf(c.id) }; }) } });
      var v = await fetch(API + "/api/webauthn/login/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: b64url(a.rawId), clientDataJSON: b64url(a.response.clientDataJSON), authenticatorData: b64url(a.response.authenticatorData), signature: b64url(a.response.signature) }) });
      var j = await v.json();
      if (j.session) { entrou(j.session); return; }
      aviso(nomeBio + " não confirmou. Tente de novo ou use a senha.", "erro");
    } catch (e) {
      aviso(e && e.name === "NotAllowedError" ? "Cancelado." : "Não deu para usar o " + nomeBio + ". Use a senha.", e && e.name === "NotAllowedError" ? "" : "erro");
    }
    pkBtn.disabled = false;
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
  }
})();
