  @font-face { font-family:'Jack';    src:url('TRYJackAlpha-Regular.woff2') format('woff2'), url('TRYJackAlpha-Regular.ttf') format('truetype'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Clother'; src:url('TRYClother-Regular.woff2') format('woff2'), url('TRYClother-Regular.ttf') format('truetype'); font-weight:400; font-display:swap; }

  :root{
    --laranja:#C8501A; --preto:#0D0D0B; --areia:#F0ECE4;
    --clother:'Clother','Helvetica Neue',sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  html{ background:var(--laranja); -webkit-font-smoothing:antialiased; }
  body{
    background:var(--laranja); color:var(--preto); font-family:var(--clother);
    line-height:1.5; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; position:relative; overflow:hidden;
  }
  /* Textura ruido papel */
  body::before{
    content:''; position:fixed; inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events:none; z-index:0; opacity:0.35;
  }
  /* Papel de sketch — grid fino em preto mangue sobre laranja */
  body::after{
    content:''; position:fixed; inset:0;
    background-image:
      linear-gradient(to right, rgba(13,13,11,0.12) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(13,13,11,0.12) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    pointer-events:none; z-index:0;
  }

  .canto{
    position:fixed; left:0; bottom:0; margin:0; padding:0;
    width:clamp(140px, 22vw, 240px); height:auto; display:block;
    pointer-events:none; z-index:1;
  }

  .box{ max-width:460px; width:100%; display:flex; flex-direction:column; align-items:center; gap:22px; position:relative; z-index:2; }

  .caranguejo{ width:min(22vw, 96px); height:auto; display:block; opacity:0.95; }
  .caranguejo path{ fill:var(--preto); }

  .lbl{
    font-family:var(--clother); font-size:0.58rem; font-weight:700;
    letter-spacing:0.2em; text-transform:uppercase;
    display:flex; align-items:center; gap:10px; color:rgba(13,13,11,0.65);
    justify-content:center;
  }
  .lbl::before{ content:''; display:block; width:22px; height:1px; background:currentColor; }

  .t1{
    font-family:var(--clother); font-weight:900; color:var(--preto);
    font-size:clamp(2.2rem, 6.2vw, 3.6rem); line-height:1;
    letter-spacing:-0.01em; margin:0;
  }

  form{ width:100%; display:flex; flex-direction:column; align-items:stretch; gap:14px; margin-top:8px; }
  .senha-wrap{ position:relative; }
  input[type="password"]{
    width:100%;
    background:transparent; border:none; border-bottom:1px solid rgba(13,13,11,0.35);
    border-radius:0; padding:14px 4px; text-align:center;
    font-family:var(--clother); font-size:1.05rem; letter-spacing:0.14em;
    color:var(--preto);
  }
  input[type="password"]::placeholder{ letter-spacing:0.24em; text-transform:uppercase; font-size:0.75rem; color:rgba(13,13,11,0.55); font-weight:700; }
  input[type="password"]:focus{ outline:none; border-bottom-color:var(--preto); box-shadow:none; }

  .msg{
    min-height:1em; font-family:var(--clother); font-weight:700;
    font-size:0.7rem; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--preto); opacity:0; transition:opacity .2s;
  }
  .msg.on{ opacity:1; }
  .msg.info{ opacity:0.7; }

  button[type="submit"]{
    background:var(--preto); color:var(--areia);
    border:1.5px solid var(--preto); border-radius:999px;
    box-shadow:3px 3px 0 0 var(--preto);
    padding:14px 28px; font-family:var(--clother); font-weight:700;
    font-size:0.72rem; letter-spacing:0.24em; text-transform:uppercase;
    cursor:pointer; align-self:center;
    transition:transform .12s, box-shadow .12s, background .18s, color .18s;
  }
  button[type="submit"]:hover{ background:var(--areia); color:var(--preto); }
  button[type="submit"]:active{ transform:translate(3px,3px); box-shadow:0 0 0 0 var(--preto); }
  button[type="submit"]:disabled{ opacity:0.4; cursor:wait; box-shadow:none; }

  .foot{
    margin-top:8px; padding-top:14px; border-top:1px solid rgba(13,13,11,0.2);
    font-size:0.55rem; letter-spacing:0.22em; color:rgba(13,13,11,0.7);
  }

<script>
(function(){
  var splash = document.getElementById('maratu-splash');
  if(!splash) return;
  function kill(){ try{ if(splash && splash.parentNode) splash.parentNode.removeChild(splash); }catch(e){} }
  try{
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ kill(); return; }
    if(sessionStorage.getItem('maratu-intro')){ kill(); return; }
    var hasTok=false; try{ hasTok=!!localStorage.getItem('maratu.token'); }catch(e){}
    // login.html: so anima se NAO estiver logado (se logado, autoLogin manda pro admin que anima la)
    if(hasTok){ kill(); return; }
    sessionStorage.setItem('maratu-intro','1');
    // FAILSAFE: nunca deixar o overlay preso na frente do painel
    var failsafe = setTimeout(kill, 6500);

    var V = getComputedStyle(splash);
    var num = function(n){ return parseFloat(V.getPropertyValue(n)); };
    var SMOOTH = 'cubic-bezier(.45,0,.4,1)';
    var pBody = splash.querySelector('#p-body');
    var sub   = splash.querySelector('#mi-wm-sub');
    var crabEls = [].slice.call(splash.querySelectorAll('#mi-crab path'));
    var wordEls = [].slice.call(splash.querySelectorAll('#mi-wm-main > *'));

    function drawFill(el, delay, draw, fill){
      var len = el.getTotalLength();
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
      el.style.strokeOpacity = 1;
      el.style.fillOpacity = 0;
      el.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
        { duration: draw, delay: delay, fill:'forwards', easing:'cubic-bezier(.65,0,.35,1)' });
      el.animate([{ fillOpacity:0, strokeOpacity:1 }, { fillOpacity:1, strokeOpacity:0 }],
        { duration: fill, delay: delay + draw, fill:'forwards', easing:'ease-out' });
    }

    function zoomInvert(){
      var zoomDur = num('--mi-zoom-dur');
      var bodyRect = pBody.getBoundingClientRect();
      var splashRect = splash.getBoundingClientRect();
      var cx = bodyRect.left + bodyRect.width/2, cy = bodyRect.top + bodyRect.height/2;
      var originX = (cx - splashRect.left) / splashRect.width * 100;
      var originY = (cy - splashRect.top ) / splashRect.height * 100;
      splash.style.transformOrigin = originX.toFixed(2) + '% ' + originY.toFixed(2) + '%';
      var W = window.innerWidth, H = window.innerHeight;
      var maxDist = Math.max(Math.hypot(cx,cy), Math.hypot(W-cx,cy), Math.hypot(cx,H-cy), Math.hypot(W-cx,H-cy));
      var nearEdge = Math.min(bodyRect.width, bodyRect.height) / 2;
      var scale = Math.max((maxDist / nearEdge) * 1.5, 12);
      splash.animate([{ transform:'scale(1)' }, { transform:'scale(' + scale.toFixed(1) + ')' }],
        { duration: zoomDur, fill:'forwards', easing: SMOOTH });
      setTimeout(function(){ clearTimeout(failsafe); kill(); }, zoomDur + 40);
    }

    function play(){
      var CD=num('--mi-crab-draw'), CF=num('--mi-crab-fill'), CS=num('--mi-crab-stagger');
      var GAP=num('--mi-wm-gap'), WD=num('--mi-wm-draw'), WF=num('--mi-wm-fill');
      var SUB=num('--mi-sub-fade'), HOLD=num('--mi-hold');
      crabEls.forEach(function(el,i){ drawFill(el, i*CS, CD, CF); });
      var crabEnd = (crabEls.length-1)*CS + CD + CF;
      var wmStart = crabEnd + GAP;
      wordEls.forEach(function(el){ drawFill(el, wmStart, WD, WF); });
      var wmEnd = wmStart + WD + WF;
      var subDelay = wmStart + Math.round(WD*0.5);
      sub.animate([{ opacity:0 }, { opacity:1 }], { duration:SUB, delay:subDelay, fill:'forwards', easing:'ease-out' });
      var introEnd = Math.max(wmEnd, subDelay + SUB);
      setTimeout(zoomInvert, introEnd + HOLD);
    }

    requestAnimationFrame(play);
  }catch(e){ try{ clearTimeout(failsafe); }catch(_){}; kill(); }
})();
</script>

<script>
(function blinkAratu(){
  const el = document.querySelector('.caranguejo');
  if(!el) return;
  const eyeL = el.querySelector('[data-aratu="eye-left"]');
  const eyeR = el.querySelector('[data-aratu="eye-right"]');
  let last = Date.now() + 1200;
  let blinking = false, start = 0;
  function frame(){
    const now = Date.now();
    if(!blinking && now - last > 2500 + Math.random()*2000){ blinking = true; start = now; }
    if(blinking){
      const p = (now - start) / 180;
      if(p >= 1){
        blinking = false; last = now;
        eyeL.setAttribute('transform','translate(105.5 24.08) scale(1 1) translate(-105.5 -24.08)');
        eyeR.setAttribute('transform','translate(212.74 24.08) scale(1 1) translate(-212.74 -24.08)');
      } else {
        const s = p < 0.5 ? 1 - p*2*0.9 : 0.1 + (p-0.5)*2*0.9;
        eyeL.setAttribute('transform','translate(105.5 24.08) scale(1 '+s+') translate(-105.5 -24.08)');
        eyeR.setAttribute('transform','translate(212.74 24.08) scale(1 '+s+') translate(-212.74 -24.08)');
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

const API = "https://maratu-api.raphaelnascimento.workers.dev";
const form = document.getElementById('loginForm');
const input = document.getElementById('loginSenha');
const msg = document.getElementById('loginMsg');
const btn = document.getElementById('loginBtn');

/* Se veio de expiração, mostrar aviso */
(function showReason(){
  const p = new URLSearchParams(location.search);
  if(p.get('expired') === '1'){
    msg.textContent = 'sessão expirou — entre de novo';
    msg.classList.add('on','info');
  } else if(p.get('logout') === '1'){
    msg.textContent = 'você saiu';
    msg.classList.add('on','info');
  }
})();

/* Se já tem token válido salvo, entra direto. Senão fica no form de login. */
(async function autoLogin(){
  let tk = null;
  try { tk = localStorage.getItem('maratu.token'); } catch(e){}
  if (!tk) return;
  try{
    const r = await fetch(API + "/api/state", {
      headers: { Authorization: "Bearer " + tk }
    });
    if(r.ok){
      location.replace('/admin.html');
    } else if(r.status === 401){
      try { localStorage.removeItem('maratu.token'); } catch(e){}
    }
  }catch(e){}
})();

const totpWrap = document.getElementById('totpWrap');
const totpInput = document.getElementById('loginTotp');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const pw = (input.value || '').trim();
  if(!pw) return;
  const totp = (totpInput.value || '').trim();
  btn.disabled = true; msg.classList.remove('on','info');
  try{
    const headers = { Authorization: "Bearer " + pw };
    if(totp) headers['X-TOTP-Code'] = totp;
    const r = await fetch(API + "/api/state", { credentials:'include', headers });
    if(r.status === 401){
      let body = {};
      try { body = await r.json(); } catch(e){}
      btn.disabled = false;
      if(body.error === 'totp_required'){
        totpWrap.style.display = '';
        totpInput.focus();
        msg.textContent = 'código 2FA necessário';
        msg.classList.add('on','info');
        return;
      }
      if(body.error === 'totp_invalid'){
        totpWrap.style.display = '';
        totpInput.value = ''; totpInput.focus();
        msg.textContent = 'código 2FA inválido';
        msg.classList.add('on');
        return;
      }
      msg.textContent = 'senha incorreta';
      msg.classList.add('on');
      input.value = ''; input.focus();
      return;
    }
    if(!r.ok){
      btn.disabled = false;
      msg.textContent = 'erro ' + r.status;
      msg.classList.add('on');
      return;
    }
    try { localStorage.setItem('maratu.token', pw); } catch(e){}
    location.replace('/admin.html');
  }catch(e){
    btn.disabled = false;
    msg.textContent = 'sem conexão';
    msg.classList.add('on');
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function (e) {
      console.warn('sw register failed:', e);
    });
  });
}
</script>
