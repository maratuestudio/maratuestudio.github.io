  <script>
    /* Anti-enquadramento. O certo seria o cabecalho frame-ancestors, mas ele so vale como
       cabecalho de verdade e o GitHub Pages nao manda cabecalho. Enquanto nao houver uma
       Transform Rule na Cloudflare, isto resolve o caso pratico: se a pagina for aberta
       dentro de um iframe de outro site, ela tenta escapar; se o navegador barrar, ela se
       apaga em vez de servir de isca. */
    (function () {
      if (window.top === window.self) return;
      try { window.top.location.replace(window.self.location.href); }
      catch (e) {
        document.addEventListener("DOMContentLoaded", function () {
          document.body.innerHTML = "";
          document.body.style.background = "#0D0D0B";
        });
      }
    })();
  </script>

@font-face { font-family: "Clother"; src: url("TRYClother-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Clother"; src: url("TRYClother-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

:root {
  --tela: #E8E2D6;
  --lateral: #DFD8CA;
  --cartao: #F7F4EE;
  --cartao-2: #EDE7DC;
  --campo: #FFFFFF;
  --tinta: #0D0D0B;
  --tinta-sobre-tela: #0D0D0B;
  --suave: rgba(13,13,11,.6);
  --realce: rgba(13,13,11,.06);
  --linha: rgba(13,13,11,.13);
  --borda: #0D0D0B;
  --sombra: #0D0D0B;
  --acento: #C8501A;
  --acento-tinta: #FFFFFF;
  --atraso: #A3400F;
  --feito: #357550;
  --adiar: #0D0D0B;
  --c-aviso: #B23A2E;
  --c-post: #A0336B;
  --dc-azul: #2E6FC4; --dc-verde: #357550; --dc-amarelo: #D4960A; --dc-laranja: #C8501A;
  --listra: repeating-linear-gradient(135deg, rgba(127,127,127,.22) 0 6px, transparent 6px 12px);
  --c-site: #C8501A; --c-lead: #2C69BA; --c-carne: #8B6207; --c-agenda: #6B4FA0; --c-loja: #0D0D0B; --c-nota: #7A6A55;
  --raio: 16px;
  --font: "Clother", "Helvetica Neue", Arial, sans-serif;
  --topo-h: 58px;
  --seguro-baixo: env(safe-area-inset-bottom, 0px);
  --seguro-topo: env(safe-area-inset-top, 0px);
  --mola: cubic-bezier(.2, .9, .25, 1);
}
:root[data-theme="laranja"] { --tela: #C8501A; --lateral: #C8501A; --cartao: #F0ECE4; --cartao-2: #E5DFD3; --realce: rgba(240,236,228,.2); }
:root[data-theme="noite"] {
  --tela: #0D0D0B; --lateral: #0D0D0B; --realce: rgba(240,236,228,.08); --cartao: #1F1F1B; --cartao-2: #292923; --campo: #14140F; --tinta: #F0ECE4; --tinta-sobre-tela: #F0ECE4;
  --suave: rgba(240,236,228,.6); --linha: rgba(240,236,228,.14); --borda: rgba(240,236,228,.3); --sombra: rgba(240,236,228,.22);
  --acento: #2E6FC4; --acento-tinta: #FFFFFF; --adiar: #3A3A33;
  --c-post: #D9679F; --c-site: #E25F23; --c-lead: #4F8AD6; --c-carne: #D4960A; --c-agenda: #9A7FD0; --c-loja: #5E5A52; --c-nota: #B3A38C;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--tela); color: var(--tinta); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow-x: clip; }
body { min-height: 100dvh; overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* topo: some ao rolar pra baixo, volta ao subir */
.topo {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  padding: calc(var(--seguro-topo) + 10px) 16px 8px;
  display: flex; align-items: center; gap: 10px;
  background: var(--tela);
  transition: transform .32s var(--mola);
}
.topo.escondido { transform: translateY(-110%); }
.marca { font-family: "Jack", var(--font); font-size: 26px; line-height: 1; color: var(--tinta-sobre-tela); letter-spacing: .01em; }
.topo .sp { flex: 1; }
.ico-bt {
  width: 44px; height: 44px; display: grid; place-items: center; flex: none;
  background: var(--cartao); color: var(--tinta); border: 1.5px solid var(--borda); border-radius: 14px;
  box-shadow: 2px 2px 0 var(--sombra); padding: 0;
}
.ico-bt svg { width: 20px; height: 20px; }
.ico-bt:active, .bt:active, .chip-bt:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--sombra); }

/* telas */
main { padding: calc(var(--seguro-topo) + var(--topo-h) + 8px) 12px calc(var(--seguro-baixo) + 110px); max-width: 560px; margin: 0 auto; }
.vista { display: grid; gap: 12px; align-content: start; }
.vista.entra-dir { animation: entraDir .34s var(--mola); }
.vista.entra-esq { animation: entraEsq .34s var(--mola); }
@keyframes entraDir { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes entraEsq { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

.cab { color: var(--tinta-sobre-tela); padding: 2px 4px 0; }
.cab h1 { margin: 0; font-size: 30px; font-weight: 900; line-height: 1.02; letter-spacing: -.015em; }
.cab p { margin: 3px 0 0; font-size: 14px; font-weight: 700; opacity: .78; }
.secao { color: var(--tinta-sobre-tela); font-size: 17px; font-weight: 900; margin: 14px 4px 0; display: flex; align-items: baseline; gap: 8px; }
.secao small { font-size: 13px; font-weight: 700; opacity: .7; }
.secao .bt-link { margin-left: auto; }

.cartao { background: var(--cartao); color: var(--tinta); border: 1.5px solid var(--borda); border-radius: var(--raio); box-shadow: 3px 3px 0 var(--sombra); padding: 14px; min-width: 0; }
.cartao.lista { padding: 4px 14px; }
.vazio { color: var(--tinta-sobre-tela); font-size: 14px; font-weight: 700; opacity: .7; padding: 4px 4px 0; }

/* filtros */
.filtros { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 2px 12px 4px; }
.filtros::-webkit-scrollbar { display: none; }
.chip-bt {
  flex: none; min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1.5px solid var(--borda);
  background: var(--cartao); color: var(--tinta); font-size: 13px; font-weight: 900; display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 2px 2px 0 var(--sombra);
}
.chip-bt[aria-pressed="true"] { background: var(--tinta); color: var(--cartao); }
.chip-bt .n { font-variant-numeric: tabular-nums; opacity: .7; }

/* selo de tipo */
.tipo { flex: none; font-size: 10px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: #fff; padding: 4px 8px; border-radius: 999px; line-height: 1; }
.t-site { background: var(--c-site); } .t-lead { background: var(--c-lead); } .t-carne { background: var(--c-carne); }
.t-agenda { background: var(--c-agenda); } .t-loja { background: var(--c-loja); } .t-nota { background: var(--c-nota); } .t-feito { background: var(--feito); } .t-post { background: var(--c-post); }

/* cartas da fila */
.fila { display: grid; gap: 10px; }
.slot { position: relative; border-radius: var(--raio); transition: height .3s var(--mola), margin .3s var(--mola), opacity .25s; }
.slot.saindo { opacity: 0; }
.fundo { position: absolute; inset: 0; border-radius: var(--raio); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-weight: 900; font-size: 15px; color: #fff; border: 1.5px solid var(--borda); opacity: 0; }
.fundo span { display: inline-flex; align-items: center; gap: 7px; }
.fundo svg { width: 20px; height: 20px; }
.fundo.dir { background: var(--feito); }
.fundo.esq { background: var(--adiar); justify-content: flex-end; }
.carta { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; }
.carta.solta { transition: transform .32s var(--mola); }
.carta .l1 { display: flex; align-items: center; gap: 8px; }
.carta .l1 .quando { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--suave); white-space: nowrap; }
.carta .quando.atraso { color: var(--atraso); }
.carta h3 { margin: 8px 0 0; font-size: 17px; font-weight: 900; line-height: 1.22; }
.carta .sub { margin: 3px 0 0; font-size: 13.5px; color: var(--suave); line-height: 1.4; }
.carta .msg { margin: 10px 0 0; background: var(--cartao-2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.carta .acoes { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.valor { font-variant-numeric: tabular-nums; font-weight: 900; }

/* botões */
.bt {
  min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--borda);
  background: var(--campo); color: var(--tinta); font-size: 14px; font-weight: 900;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; box-shadow: 2px 2px 0 var(--sombra);
  text-decoration: none; white-space: nowrap;
}
.bt svg { width: 17px; height: 17px; flex: none; }
.bt.preto { background: var(--tinta); color: var(--cartao); }
.bt.acento { background: var(--acento); color: var(--acento-tinta); }
.bt.verde { background: var(--feito); color: #fff; }
.bt.cheio { width: 100%; }
.bt[disabled] { opacity: .5; }
.bt-link { background: none; border: 0; padding: 8px 0; min-height: 40px; font-size: 14px; font-weight: 900; color: inherit; text-decoration: underline; text-underline-offset: 3px; }

/* números */
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.num { background: var(--cartao); color: var(--tinta); border: 1.5px solid var(--borda); border-radius: 14px; padding: 10px 12px; box-shadow: 2px 2px 0 var(--sombra); min-width: 0; }
.num b { display: block; font-size: 24px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
.num span { font-size: 12px; font-weight: 700; color: var(--suave); }

/* mês */
.mes { display: grid; gap: 10px; }
.mes .topo-mes { display: flex; align-items: baseline; gap: 10px; }
.mes .grande { font-size: 34px; font-weight: 900; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mes .comp { margin-left: auto; font-size: 13px; font-weight: 900; }
.mes .comp { color: var(--suave); } .mes .comp.sobe { color: var(--feito); } .mes .comp.desce { color: var(--c-site); }
.barra-meta { height: 10px; border-radius: 99px; background: var(--cartao-2); overflow: hidden; border: 1px solid var(--linha); }
.barra-meta i { display: block; height: 100%; background: var(--acento); border-radius: 99px; transition: width .6s var(--mola); }
.mes .rodape { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--suave); }
.mini-mes { display: flex; align-items: center; gap: 12px; }
.mini-mes .barra-meta { flex: 1; }

/* linhas de lista */
.linha { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--linha); min-height: 56px; }
.linha:first-child { border-top: 0; }
.linha .o { flex: 1; min-width: 0; }
.linha .o b { display: block; font-size: 15px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linha .o small { display: block; font-size: 12.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linha.toca { cursor: pointer; }
.linha > svg { width: 18px; height: 18px; flex: none; color: var(--suave); }
.linha .seta { width: 18px; height: 18px; color: var(--suave); flex: none; }
.dia-rot { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-sobre-tela); opacity: .8; margin: 10px 4px -4px; display: flex; justify-content: space-between; }

/* segmento */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--cartao); border: 1.5px solid var(--borda); border-radius: 14px; padding: 4px; gap: 4px; box-shadow: 2px 2px 0 var(--sombra); }
.seg button { min-height: 40px; border: 0; border-radius: 10px; background: none; font-size: 14px; font-weight: 900; color: var(--tinta); }
.seg button[aria-pressed="true"] { background: var(--tinta); color: var(--cartao); }

/* barra de baixo */
.barra {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--seguro-baixo) + 10px); width: min(536px, calc(100% - 24px));
  background: var(--cartao); border: 1.5px solid var(--borda); border-radius: 24px; box-shadow: 3px 3px 0 var(--sombra);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 6px; gap: 2px;
}
.barra button { border: 0; background: none; color: var(--tinta); display: grid; justify-items: center; gap: 2px; padding: 6px 0 4px; border-radius: 16px; min-height: 52px; font-size: 10.5px; font-weight: 900; letter-spacing: .02em; }
.barra button svg { width: 22px; height: 22px; }
.barra button[aria-current="page"] { background: var(--tinta); color: var(--cartao); }
.barra .lancar { width: 58px; height: 58px; justify-self: center; border-radius: 19px; background: var(--acento); color: var(--acento-tinta); border: 1.5px solid var(--borda); box-shadow: 2px 2px 0 var(--sombra); margin-top: -26px; padding: 0; place-items: center; }
.barra .lancar svg { width: 26px; height: 26px; transition: transform .3s var(--mola); }
.barra .lancar[aria-expanded="true"] svg { transform: rotate(45deg); }
.barra .ponto { position: relative; }
.barra .ponto::after { content: attr(data-n); position: absolute; top: 2px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--c-site); color: #fff; font-size: 10.5px; line-height: 18px; text-align: center; }
.barra .ponto[data-n="0"]::after, .barra .ponto:not([data-n])::after { display: none; }

/* folhas */
.veu { position: fixed; inset: 0; z-index: 50; background: rgba(13,13,11,.42); opacity: 0; transition: opacity .3s; pointer-events: none; }
.veu.on { opacity: 1; pointer-events: auto; }
.folha {
  position: fixed; z-index: 60; left: 50%; bottom: 0; width: min(560px, 100%);
  max-height: calc(100dvh - var(--seguro-topo) - 24px); display: flex; flex-direction: column;
  background: var(--cartao); color: var(--tinta); border: 1.5px solid var(--borda); border-bottom: 0; border-radius: 26px 26px 0 0;
  transform: translate(-50%, calc(100% + 40px)); visibility: hidden; transition: transform .38s var(--mola), visibility 0s linear .38s;
  box-shadow: 0 -4px 0 rgba(13,13,11,.18);
}
.folha.on { transform: translate(-50%, 0); visibility: visible; transition: transform .38s var(--mola); }
.folha.arrastando { transition: none; }
.folha .alca { flex: none; padding: 10px 0 6px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.folha .alca i { width: 46px; height: 5px; border-radius: 9px; background: var(--linha); background: rgba(127,127,127,.45); }
.folha .cab-folha { flex: none; display: flex; align-items: center; gap: 10px; padding: 0 18px 8px; touch-action: none; }
.folha .cab-folha h2 { margin: 0; font-size: 21px; font-weight: 900; flex: 1; min-width: 0; line-height: 1.15; }
.folha .corpo { overflow-y: auto; overscroll-behavior: contain; padding: 4px 18px calc(var(--seguro-baixo) + 22px); display: grid; gap: 12px; align-content: start; }

/* formulário */
.campo { display: grid; gap: 5px; }
.campo label, .rot { font-size: 12.5px; font-weight: 900; color: var(--suave); }
.campo input, .campo select, .campo textarea {
  width: 100%; min-height: 48px; padding: 11px 13px; border: 1.5px solid var(--borda); border-radius: 12px; background: var(--campo);
  font-size: 16px; color: var(--tinta); -webkit-appearance: none; appearance: none;
}
.campo textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
.campo input.valor-grande { font-size: 30px; font-weight: 900; min-height: 64px; font-variant-numeric: tabular-nums; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tipos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tipos button { min-height: 64px; border: 1.5px solid var(--borda); border-radius: 14px; background: var(--campo); display: grid; place-items: center; gap: 4px; padding: 8px 4px; font-size: 13px; font-weight: 900; }
.tipos button svg { width: 22px; height: 22px; }
.tipos button[aria-pressed="true"] { background: var(--tinta); color: var(--cartao); }
.pilulas { display: flex; flex-wrap: wrap; gap: 7px; }
.pilulas button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--borda); background: var(--campo); font-size: 13.5px; font-weight: 900; }
.pilulas button[aria-pressed="true"] { background: var(--tinta); color: var(--cartao); }
.marcar { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; font-weight: 700; }
.marcar input { width: 22px; height: 22px; accent-color: var(--tinta); }
.msg-grande { background: var(--cartao-2); border-radius: 14px; padding: 13px 14px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
.grade-bts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.perigo { color: #B23A2E; }

/* agenda: semana e linha do dia */
.semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.semana button { min-height: 60px; border: 1.5px solid var(--borda); border-radius: 14px; background: var(--cartao); color: var(--tinta); display: grid; place-items: center; align-content: center; gap: 2px; padding: 4px 0; box-shadow: 2px 2px 0 var(--sombra); }
.semana button small { font-size: 10.5px; font-weight: 900; text-transform: uppercase; opacity: .65; }
.semana button b { font-size: 18px; font-weight: 900; line-height: 1; }
.semana button i { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.semana button.tem i { background: var(--c-site); }
.semana button.hoje b { text-decoration: underline; text-underline-offset: 3px; }
.semana button[aria-pressed="true"] { background: var(--tinta); color: var(--cartao); }
.semana button[aria-pressed="true"].tem i { background: var(--cartao); }
.nav-dia { display: flex; align-items: center; gap: 8px; }
.nav-dia .cab { flex: 1; }
.linha-dia { position: relative; padding-left: 58px; display: grid; gap: 9px; touch-action: pan-y; min-height: 200px; }
.linha-dia::before { content: ""; position: absolute; left: 47px; top: 6px; bottom: 6px; width: 2px; background: var(--tinta-sobre-tela); opacity: .35; }
.ponto-dia { position: relative; }
.ponto-dia .hora { position: absolute; left: -58px; top: 14px; width: 40px; text-align: right; font-size: 12px; font-weight: 900; color: var(--tinta-sobre-tela); font-variant-numeric: tabular-nums; }
.ponto-dia::before { content: ""; position: absolute; left: -16px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--cartao); border: 2px solid var(--tinta-sobre-tela); }
.ponto-dia .cartao { padding: 11px 12px; display: flex; gap: 9px; align-items: center; box-shadow: 2px 2px 0 var(--sombra); }
.ponto-dia .cartao .o { flex: 1; min-width: 0; }
.ponto-dia .cartao b { display: block; font-size: 15px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ponto-dia .cartao small { display: block; font-size: 12.5px; color: var(--suave); }
.ponto-dia.feito .cartao { opacity: .55; box-shadow: none; }

.agora { position: relative; height: 24px; margin-left: -58px; display: flex; align-items: center; }
.agora span { background: var(--tinta-sobre-tela); color: var(--tela); font-size: 11.5px; font-weight: 900; padding: 4px 9px; border-radius: 999px; z-index: 1; font-variant-numeric: tabular-nums; }

/* mês na folha */
.mes-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }

.mes-grade button i { display: flex; gap: 2px; height: 5px; }
.mes-grade button i em { width: 5px; height: 5px; border-radius: 50%; background: var(--c-site); }
.mes-grade button.hoje { border-color: var(--borda); }
.mes-grade button.sel { background: var(--tinta); color: var(--cartao); }
.mes-grade button.fora { opacity: .3; }

/* aviso */
.aviso {
  position: fixed; z-index: 80; left: 50%; bottom: calc(var(--seguro-baixo) + 92px); transform: translate(-50%, 20px); opacity: 0;
  background: var(--tinta); color: var(--cartao); border-radius: 14px; padding: 6px 6px 6px 16px; min-height: 48px;
  display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 900; box-shadow: 3px 3px 0 var(--acento);
  transition: opacity .25s, transform .3s var(--mola); max-width: calc(100% - 32px); pointer-events: none;
}
.aviso.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

/* carregando */
.esqueleto { height: 110px; border-radius: var(--raio); background: var(--cartao); opacity: .5; animation: pulsa 1.2s ease-in-out infinite; }
@keyframes pulsa { 50% { opacity: .3; } }

/* busca */


/* progresso do dia, dia fechado, metas */
.progresso-dia { display: flex; align-items: center; gap: 12px; padding: 0 4px; color: var(--tinta-sobre-tela); font-size: 13px; font-weight: 900; }
.progresso-dia .barra-meta { flex: 1; } .progresso-dia .barra-meta i, .meta .barra-meta i { background: var(--feito); }
.progresso-dia span { white-space: nowrap; font-variant-numeric: tabular-nums; }
.fechado { display: grid; gap: 12px; }
.fechado-cab { display: flex; align-items: center; gap: 10px; }
.fechado-cab svg { width: 30px; height: 30px; padding: 6px; border-radius: 50%; background: var(--feito); color: #fff; }
.fechado-cab h3 { margin: 0; font-size: 20px; font-weight: 900; }
.fechado .num { box-shadow: none; background: var(--cartao-2); border-color: transparent; }
.metas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meta { display: grid; gap: 10px; padding: 12px 14px; }

.meta-num span { font-size: 12.5px; font-weight: 700; color: var(--suave); }
.quando-lido { margin: 2px 0 0; display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 900; color: var(--c-agenda); }
.quando-lido svg { width: 16px; height: 16px; }

/* botões discretos dos cartões no computador */
.acoes-pc .ico-bt { width: 40px; height: 40px; box-shadow: none; border-color: var(--linha); background: transparent; color: var(--suave); }
.acoes-pc .ico-bt svg { width: 19px; height: 19px; }
.acoes-pc .pc-dir:hover { background: var(--feito); border-color: var(--borda); color: #fff; box-shadow: 2px 2px 0 var(--sombra); }
.acoes-pc .pc-esq:hover { background: var(--tinta); border-color: var(--borda); color: var(--cartao); box-shadow: 2px 2px 0 var(--sombra); }

/* botão principal sempre à vista no fim da folha */
.fixo { position: sticky; bottom: calc(-22px - var(--seguro-baixo)); z-index: 3; display: grid; gap: 8px;
  margin: 4px -18px calc(-22px - var(--seguro-baixo)); padding: 12px 18px calc(18px + var(--seguro-baixo));
  background: var(--cartao); border-top: 1px solid var(--linha); }
.fixo.grade-bts { grid-template-columns: 1fr 1fr; }

/* dica de arrastar, sem texto */
.slot.dica .carta { animation: dicaCarta 1.4s var(--mola); }
.slot.dica .fundo.dir { animation: dicaFundo 1.4s ease; }
@keyframes dicaCarta { 0% { transform: none; } 35% { transform: translateX(72px) rotate(1.2deg); } 70%, 100% { transform: none; } }
@keyframes dicaFundo { 0%, 100% { opacity: 0; } 30%, 50% { opacity: 1; } }

/* busca: caixa no topo, estilo Spotlight */
.busca {
  position: fixed; z-index: 70; left: 50%; top: calc(var(--seguro-topo) + 10px); width: min(640px, calc(100% - 20px));
  max-height: calc(100dvh - var(--seguro-topo) - 20px); display: flex; flex-direction: column;
  background: var(--cartao); color: var(--tinta); border: 1.5px solid var(--borda); border-radius: 18px; box-shadow: 4px 4px 0 var(--sombra);
  opacity: 0; visibility: hidden; transform: translate(-50%, -10px) scale(.98);
  transition: opacity .18s, transform .25s var(--mola), visibility 0s linear .25s;
}
.busca.on { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity .18s, transform .25s var(--mola); }
.busca-caixa { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 16px; border-bottom: 1px solid var(--linha); flex: none; }
.busca-caixa > svg { width: 20px; height: 20px; color: var(--suave); flex: none; }
.busca-caixa input { flex: 1; min-width: 0; min-height: 52px; border: 0; background: none; font-size: 18px; font-weight: 700; color: var(--tinta); outline: none; -webkit-appearance: none; appearance: none; }

.busca-x { flex: none; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 1.5px solid var(--linha); border-radius: 11px; background: none; color: var(--suave); }

.grupo-rot { font-size: 11.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); padding: 10px 10px 4px; }
.opcao { display: flex; align-items: center; gap: 12px; padding: 9px 10px; min-height: 50px; border-radius: 12px; cursor: pointer; }
.opcao > svg { width: 19px; height: 19px; flex: none; color: var(--suave); }
.opcao .o { flex: 1; min-width: 0; }

.opcao .o small { display: block; font-size: 12.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opcao[aria-selected="true"] { background: var(--cartao-2); }
.busca-vazia { margin: 0; padding: 18px 12px; color: var(--suave); font-weight: 700; }
.topo-pc { display: none; }
@media (max-width: 1023px) { .busca { max-height: 52dvh; } }

/* Estúdio */
#btMais[aria-pressed="true"] { background: var(--tinta); color: var(--cartao); }
.atalhos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* avisos do sistema e impressora */

.faixa-imp { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 12px 14px; text-decoration: none; color: var(--tinta); }

.pulso { width: 12px; height: 12px; border-radius: 50%; background: var(--feito); animation: pulso 1.6s ease-in-out infinite; }

/* olho e resumo por origem */

.taxa { margin: 0; font-size: 13px; font-weight: 700; color: var(--suave); }

/* dia indisponível e cor do dia */
.mes-grade button.dia-off, .semana button.dia-off { background-image: var(--listra); }
.mes-grade button.dia-azul, .semana button.dia-azul, .wk-dia.dia-azul { box-shadow: inset 0 -4px 0 var(--dc-azul); }

.ponto-cor { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
.ponto-cor.dia-azul { background: var(--dc-azul); } .ponto-cor.dia-verde { background: var(--dc-verde); } .ponto-cor.dia-amarelo { background: var(--dc-amarelo); } .ponto-cor.dia-laranja { background: var(--dc-laranja); }
.dia-indisp { background-image: var(--listra); text-align: left; font-size: 15px; font-weight: 900; padding: 12px 14px; cursor: pointer; }

.seg-mini { display: inline-grid; grid-auto-flow: column; padding: 3px; gap: 3px; box-shadow: none; }
.seg-mini button { min-height: 36px; padding: 0 12px; font-size: 13px; }

/* semana com horários (computador) */
.semana-pc { padding: 0; overflow: hidden; }

:root[data-theme="noite"] .wk-ev:not(.t-loja):not(.t-feito), :root[data-theme="noite"] .wk-chip:not(.t-loja):not(.t-feito) { color: #0D0D0B; }

/* produtos */

.camera-sl .dica-c { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: #fff; font-weight: 800; font-size: 14px; }
.digitar-sl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.digitar-sl input { width: 100%; text-transform: uppercase; }
.grade-prod { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.gp { border: 1.5px solid var(--linha); border-radius: 14px; background: var(--cartao); color: var(--tinta); padding: 7px; display: grid; gap: 4px; font: inherit; font-size: 13px; font-weight: 900; text-align: left; cursor: pointer; min-width: 0; }
.gp img, .gp .gp-sem { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 9px; background: var(--cartao-2); display: grid; place-items: center; font-style: normal; color: var(--suave); font-size: 22px; }
.gp span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gp small { font-weight: 700; color: var(--suave); font-size: 11.5px; }
.gp.sel { border-color: var(--acento); box-shadow: 0 0 0 2px var(--acento); }
.sl-data summary { font-size: 14px; font-weight: 900; cursor: pointer; min-height: 36px; display: flex; align-items: center; color: var(--suave); }
.sl-data[open] { display: grid; gap: 10px; }
.ok-grande { text-align: center; padding: 10px 10px 4px; }
.ok-grande .bola { width: 66px; height: 66px; border-radius: 50%; background: var(--feito); color: #fff; display: grid; place-items: center; margin: 0 auto 10px; }
.ok-grande .bola svg { width: 34px; height: 34px; }
.ok-grande b { display: block; font-size: 21px; font-weight: 900; }
.ok-grande .codigo { color: var(--suave); font-size: 14px; }
.cert { border: 1.5px solid var(--linha); border-radius: 14px; background: var(--cartao-2); padding: 12px; display: grid; gap: 4px; }
.cert .l1 { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 900; color: var(--suave); }
.cert b { font-size: 15px; font-weight: 900; }
.cert > span { font-size: 13px; color: var(--suave); font-weight: 700; }
.qtd { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
.qtd button { border: 1.5px solid var(--borda); border-radius: 14px; background: var(--cartao); color: var(--tinta); padding: 10px 6px; font: inherit; font-weight: 900; font-size: 20px; display: grid; gap: 2px; cursor: pointer; }
.qtd button small { font-size: 12px; font-weight: 700; color: var(--suave); }
.qtd button[aria-pressed="true"] { background: var(--tinta); color: var(--cartao); }
.qtd button[aria-pressed="true"] small { color: var(--cartao); opacity: .7; }
.folha-a4 { background: #fff; border: 1.5px solid var(--linha); border-radius: 6px; aspect-ratio: 210 / 297; width: 150px; margin: 0 auto; padding: 8px; display: grid; gap: 1px; align-content: start; }
.folha-a4 span { aspect-ratio: 1; background: repeating-conic-gradient(#222 0 25%, #fff 0 50%) 0 0 / 4px 4px; }
.resp { background: var(--cartao-2); border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.5; font-weight: 700; }
#seloFolha { position: fixed; inset: 0; z-index: 300; background: #fff; overflow-y: auto; padding-bottom: 40px; color: #000; }
#seloFolha .sf-barra { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; padding: calc(var(--seguro-topo) + 12px) 16px 12px; background: var(--tela); border-bottom: 1.5px solid var(--linha); color: var(--tinta); }
#seloFolha .sf-barra b { flex: 1; font-weight: 900; }
#seloFolha .sf-grade { display: flex; flex-wrap: wrap; align-content: flex-start; max-width: 100%; margin: 6mm auto; }
#seloFolha .sf-cel { display: flex; flex-direction: column; align-items: center; break-inside: avoid; page-break-inside: avoid; outline: .1mm solid #d0d0d0; outline-offset: -.05mm; }
#seloFolha .sf-qr svg { width: 100%; height: 100%; display: block; }
#seloFolha .sf-cod { font-family: ui-monospace, Menlo, monospace; line-height: 1.15; letter-spacing: .03em; color: #000; }
@media print {
  @page { size: A4; margin: 8mm; }
  body.selo-imprimindo > *:not(#seloFolha) { display: none !important; }
  #seloFolha { position: static; overflow: visible; padding: 0; }
  #seloFolha .sf-barra { display: none; }
  #seloFolha .sf-grade { margin: 0 auto; }
}

/* Hoje: faixa laranja + caderno */
:root { --faixa: #C8501A; --faixa-tinta: #FFFFFF; --aratu: #0D0D0B; }
:root[data-theme="laranja"] { --faixa: #0D0D0B; --aratu: #F7F4EE; }
body.na-hoje .topo { background: var(--faixa); }
body.na-hoje .topo .marca { color: var(--faixa-tinta); }
body.na-hoje .topo .ico-bt { background: transparent; color: var(--faixa-tinta); border-color: rgba(255,255,255,.55); box-shadow: none; }
body.na-hoje .topo #btMais[aria-pressed="true"] { background: var(--faixa-tinta); color: var(--faixa); }
.faixa-hoje { background: var(--faixa); color: var(--faixa-tinta); margin: -10px 0 0; padding: 14px 8px 58px; box-shadow: 0 0 0 100vmax var(--faixa); clip-path: inset(0 -100vmax); }
.fh-data { font-size: 12.5px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; }
.faixa-hoje h1 { margin: 3px 0 0; font-size: 34px; font-weight: 900; line-height: 1.05; }
.fh-nums { margin-top: 16px; display: flex; flex-wrap: wrap; }
.fh-nums button { border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 0 14px; border-left: 1.5px solid rgba(255,255,255,.38); display: grid; gap: 1px; cursor: pointer; }
.fh-nums button:first-child { padding-left: 0; border-left: 0; }
.fh-nums b { font-size: 19px; font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
.fh-nums span { font-size: 12px; font-weight: 700; white-space: nowrap; }
.fh-cad { position: relative; margin-top: -38px; padding: 0; overflow: visible; }
.px-aratu { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.fh-passeio { position: absolute; left: 18px; right: 18px; top: -29px; height: 30px; pointer-events: none; }
.fh-andando { position: absolute; right: 0; bottom: -1px; width: 60px; height: 30px; }
.fh-sec { padding: 16px; border-top: 1px solid var(--linha); }
.fh-sec:first-of-type { border-top: 0; }
.fh-t { font-size: 11.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); margin-bottom: 8px; display: flex; align-items: baseline; gap: 10px; }
.fh-t .bt-link { margin-left: auto; letter-spacing: 0; text-transform: none; font-size: 13px; color: var(--tinta); }
.fh-t em { margin-left: auto; font-style: normal; letter-spacing: 0; text-transform: none; font-size: 12.5px; color: var(--feito); }
.fh-ev { display: grid; grid-template-columns: 44px 14px minmax(0, 1fr); gap: 0 10px; cursor: pointer; border-radius: 10px; }
.fh-ev:hover .o b { text-decoration: underline; text-underline-offset: 3px; }
.fh-ev .h { font-size: 12.5px; font-weight: 900; color: var(--suave); padding-top: 11px; font-variant-numeric: tabular-nums; }
.fh-ev .trilho { position: relative; }
.fh-ev .trilho::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--linha); }
.fh-ev .trilho i { position: absolute; left: 1px; top: 13px; width: 12px; height: 12px; border-radius: 50%; background: var(--cartao); border: 2px solid var(--borda); }
.fh-ev .o { padding: 8px 0; min-width: 0; }
.fh-ev .o b { display: block; font-size: 15px; font-weight: 900; line-height: 1.25; }
.fh-ev .o small { display: block; font-size: 12.5px; color: var(--suave); font-weight: 700; margin-top: 1px; }
.fh-ev.passou .o, .fh-ev.passou .h { opacity: .42; }
.fh-ev.passou .trilho i { background: var(--borda); }
.fh-agora { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 10px; align-items: center; margin: 2px 0; }
.fh-agora .h { font-size: 12.5px; font-weight: 900; color: var(--atraso); font-variant-numeric: tabular-nums; }
.fh-agora .fio { display: flex; align-items: center; height: 22px; }
.fh-agora .fio canvas { width: 40px; height: 20px; flex: none; margin-left: -13px; }
.fh-agora .fio::after { content: ""; flex: 1; height: 2px; background: var(--faixa); margin-left: 4px; }
.fh-livre { margin: 4px 0 6px 54px; border: 1.5px dashed var(--faixa); border-radius: 12px; padding: 9px 10px 9px 12px; display: flex; gap: 10px; align-items: center; }
.fh-livre b { display: block; color: var(--atraso); font-weight: 900; font-size: 14px; }
.fh-livre small { display: block; color: var(--suave); font-weight: 700; font-size: 12.5px; }
.fh-livre .bt { margin-left: auto; background: var(--faixa); color: var(--faixa-tinta); border-color: var(--faixa); min-height: 36px; padding: 0 14px; font-size: 13px; box-shadow: none; flex: none; }
.fh-nada { margin: 6px 0 0; color: var(--suave); font-weight: 800; font-size: 14px; }
.fh-lista { display: grid; grid-template-columns: minmax(0, 1fr); }
.fh-slot { min-width: 0; }
.fh-cad { min-width: 0; }
.fh-slot { border-radius: 12px; }
.fh-slot + .fh-slot { border-top: 1px solid var(--linha); }
.fh-slot .fundo { border: 0; border-radius: 12px; font-size: 14px; }
.fh-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; background: var(--cartao); }
.fh-bola { width: 38px; height: 38px; margin: -7px -7px -7px -7px; border: 0; background: none; flex: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
.fh-bola::before { content: ""; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--borda); background: var(--cartao); box-sizing: border-box; }
.fh-bola:hover::before { background: var(--realce); }
.fh-item .o { flex: 1; min-width: 0; }
.fh-item h3 { margin: 0; font-size: 15px; font-weight: 800; line-height: 1.3; }
.fh-item small { display: block; font-size: 12.5px; color: var(--suave); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fh-item small.atraso { color: var(--atraso); font-weight: 900; }
.fh-tag { font-style: normal; font-size: 10px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); flex: none; }
.fh-adia { display: none; width: 34px; height: 34px; box-shadow: none; border-color: var(--linha); }
.fh-adia svg { width: 16px; height: 16px; }

@media (min-width: 1024px) {
  body.na-hoje .topo-pc { background: var(--faixa); padding-bottom: 6px; }
  .faixa-hoje { margin: -22px 0 0; padding: 26px 0 70px; }
  .faixa-hoje h1 { font-size: 44px; }
  .fh-cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; margin-top: -46px; }
  .fh-cols .fh-cad { margin-top: 0; }
  .fh-passeio { top: -44px; height: 45px; }
  .fh-andando { width: 90px; height: 45px; }
  .fh-item:hover .fh-adia { display: grid; }
}
</style>
</head>
